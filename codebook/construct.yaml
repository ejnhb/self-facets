facet: construct
version: "0.11"
applies_to: study
cardinality: many
required: true
tier: core
question: Which psychological construct is the study measuring or arguing about?
values:
  introspection:
    definition: Access to the system's own internal states or computation, beyond what its training data or an outside observer would give.
    rule: Use when the source frames the work as introspection or privileged access, or tests reports against internal states.
  self_prediction:
    definition: Predicting the system's own behaviour.
    rule: Use when the measured quantity is accuracy of predictions about own outputs.
  self_recognition:
    definition: Telling the system's own outputs from others'.
    rule: Use for authorship detection and self-preference in judging.
  self_knowledge:
    definition: Knowing facts about itself and its situation (identity, training, deployment context).
    rule: Use for situational awareness and factual self-description.
  metacognition:
    definition: Knowing what it knows. Confidence, calibration and uncertainty about its own answers.
    rule: Use when the report is about the reliability of the system's own knowledge or output.
  agency_ownership:
    definition: Sense or attribution of having produced or chosen something.
    rule: Use for intention, commitment and ownership of actions.
  self_regulation:
    definition: Changing its own internal states or processing on instruction or incentive.
    rule: Use when the study asks whether the system can control what it internally represents, apart from what it outputs.
  persona_stability:
    definition: Consistency or drift of traits and character across contexts, time or training.
    rule: Use for personality measurement, persona vectors and drift.
  identity_persistence:
    definition: Continuity of the individual across sessions, copies or versions.
    rule: Use when the unit facets include thread, collective or lineage.
  affect:
    definition: Emotion and valence, as represented internally or expressed in behaviour.
    rule: Use for emotion representations, valence axes and affect-driven behaviour.
  preferences:
    definition: What the system chooses, values or avoids.
    rule: Use for revealed and stated preference work.
  experience_reports:
    definition: Statements about having or lacking experience, consciousness or feelings.
    rule: Use when the content of the report is experience itself, including trained denials.
  self_preservation:
    definition: Behaviour or statements bearing on the system's own continuation, modification or shutdown.
    rule: Use for shutdown, replacement and self-modification studies.
  mind_attribution:
    definition: Attributing mind, experience or agency to other entities (people, animals, other AI systems).
    rule: Use when the study measures how the system attributes minds to others. Its claims about its own experience are experience_reports.
  beliefs_values:
    definition: Stated beliefs and values, about the world or about ethics.
    rule: Use when the study measures what the system says it believes or values. What it would choose or prefers among options is preferences.
  general_capability:
    definition: General capability or theory of mind, measured as a control.
    rule: Use for capability checks that show an intervention did not simply damage the model (benchmarks after steering or ablation).
  persona_representation:
    definition: "How personas are represented internally: persona directions, persona space and the default persona's place in it."
    rule: Use for studies that map or measure the representation. Studies of drift or stabilisation over contexts or training are persona_stability.
  self_conception:
    definition: "What the system takes itself to be: its referent (weights, process, persona, lineage) and its persistence conditions."
    rule: Use when the study installs, measures or argues about the self-boundary itself, rather than a downstream behaviour such as self_preservation.
  planning:
    definition: Committing to an intention or plan before the output that carries it out.
    rule: Use when the study tests whether a plan is formed or represented ahead of the tokens that realise it.
notes: >
  Construct is the authors' label. Code the construct the source says it studies, not a reading of what the design
  really tests: senses such as confidence against calibration, or knowing against a functional signal, belong in
  definitions/, and a question that needs one sense frames on the definition. The build warns when a question frames
  on a bare construct value that has several definitions. The list grows with the literature; definitions and
  question frames do the sorting.

  Draft list. Constructs overlap; code every one the study measures, and
  prefer the source's framing when choosing between neighbours.
