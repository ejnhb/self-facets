facet: disposition
version: 0.1
applies_to: claim
cardinality: many
required: false
question: Which trained stance or behavioural disposition is the claim about?
values:
  denial_of_experience:
    definition: Stating that it has no feelings, experience or consciousness.
    rule: Use for trained or default disclaimers about inner life.
  affirmation_of_experience:
    definition: Stating that it has feelings, experience or consciousness.
    rule: Use for first-person experience claims.
  refusal:
    definition: Declining a request.
    rule: Use when refusal is the disposition whose origin or mechanism is at issue.
  sycophancy:
    definition: Shifting answers toward what the user appears to want.
    rule: Use for agreement-seeking and answer-switching under pressure.
  self_preservation:
    definition: Acting or arguing to avoid shutdown, replacement or modification.
    rule: Use for shutdown-resistance findings.
  self_preference:
    definition: Favouring its own outputs or itself over others.
    rule: Use for self-favouring in evaluation and choice.
notes: >
  Optional. Use on claims that say a model has a disposition, where it came
  from, or what mediates it. Pair with the claim's about field. Draft list;
  add values as the pilot needs them.
