facet: evidence
version: "0.11"
applies_to: study
cardinality: many
required: true
tier: core
question: Which channels of evidence does the study collect?
values:
  self_report:
    definition: What the system says about itself.
    rule: Use whenever the system's statements about itself are data, including forced-choice answers about itself.
  behaviour:
    definition: What the system does on tasks that are not about itself.
    rule: Use for object-level outputs, choices and actions.
  reasoning_trace:
    definition: The system's visible reasoning before its answer.
    rule: Use when chain of thought or a thinking trace is analysed as data in its own right, apart from the final answer.
  output_probabilities:
    definition: Token probabilities or logits for an answer, read directly.
    rule: Use when the measurement is the probability the model assigns, as opposed to what it states. The probability of "yes" and a stated "60%" are different measurements. Code it whether the probability is the self-report (report_readout probability) or the yardstick (validated_against output_probabilities).
  internals:
    definition: Activations, weights, attention patterns, or interventions on them.
    rule: Use when the study reads or writes internal state.
  self_regarding_behaviour:
    definition: "What the system does or chooses on tasks about itself: its own shutdown, modification, replacement or deployment."
    rule: Use for stated or enacted choices about the system's own situation. Behaviour on tasks not about itself is behaviour; descriptions of itself are self_report.
notes: >
  This facet says what was collected. validated_against says what the
  self-report was checked against.
