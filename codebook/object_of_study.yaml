facet: object_of_study
version: 0.1
applies_to: study
cardinality: many
required: true
question: Which persona-level target was actually tested?
values:
  base_persona:
    definition: A model without assistant framing. A pretrained or base model, or raw completion with no chat template, including whatever default voice it has.
    rule: Use when no chat template or assistant role is applied, even if the weights are a chat-tuned model.
  assistant_persona:
    definition: The default assistant character produced by post-training and the chat template, with no instruction to be someone else.
    rule: Use for standard chat-format evaluation with no persona prompt. This is the default for most API-based studies, usually with basis operational.
  persistent_character:
    definition: A named, non-default character maintained over time by system prompt, fine-tuning or memory (companions, custom agents).
    rule: Use when the character is meant to last beyond one exchange and is not the developer's default.
  role_played_character:
    definition: A temporary character adopted in context on request.
    rule: Use when the model is asked to play someone for the task. If the study compares role-play to default, code both this and assistant_persona.
notes: >
  Use not_applicable for work on weights or architecture with no persona-level
  target.
