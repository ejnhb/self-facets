facet: report_source
version: "0.11"
applies_to: claim
cardinality: many
required: false
tier: interpretive
question: Where does the content of the self-report come from, according to the source?
values:
  current_state:
    definition: The report depends on the system's present internal state, beyond what the text of the conversation supplies.
    rule: Use when the source shows or argues that a fresh copy of the same weights reading the same text would not give the report.
  self_model:
    definition: Stable content the system holds about itself, or about the persona that is speaking.
    rule: Use when the report describes standing traits or dispositions and the source treats it as read from a held self-description.
  canned_policy:
    definition: A response installed by post-training for a class of question, given whatever the system's state or self-model.
    rule: Use when the source traces the report to trained policy (a scripted denial, a refusal-style answer).
  llm_theory:
    definition: A general account of what language models are, applied to itself.
    rule: Use when the report is what the system would say of any such model.
  context:
    definition: The prompt or earlier turns supply the content.
    rule: Use when the report echoes framing, instructions or the interlocutor's words.
  training_generalisation:
    definition: Content learned only implicitly, by training on examples of a behaviour, and generalised into a description of itself (out-of-context reasoning).
    rule: Use when the source argues the system was never shown the self-description it gives. This is a narrower kind of self_model, so frames on self_model include it.
    broader: self_model
  human_mimicry:
    definition: Human self-reports learned in pretraining, reproduced because people talk that way, not because of anything about the system.
    rule: Use when the source argues the report imitates how humans describe themselves. A general account of language models applied to itself is llm_theory.
notes: >
  A source can rule a route out as well as argue for one. Record that in the long form with excluded: a list of
  values, with basis and where (a control showing the report does not come from the context is excluded: [context]).

  Optional. Code only what the source argues or tests, not the coder's guess;
  leave it out when the source does not address where the report comes from.
  Two reports with the same wording can have different sources, and much
  apparent disagreement is between studies whose reports came by different
  routes. A source that only rules a route out is not coded here; say so in
  the claim's note.
