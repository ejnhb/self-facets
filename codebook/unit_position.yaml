facet: unit_position
version: 0.6
applies_to: study
cardinality: many
required: false
tier: interpretive
values_from: units
question: Which unit does the source argue is the self?
guidance: >
  Code it when the source takes a position on what the self, the subject or
  the interlocutor is. This records a view the source holds. The other three
  unit facets record what a study operationally treats as the bearer of a
  state, a disposition or a report, whether or not the source has a view. A
  source that argues against a unit is not coded with that unit here; put the
  argument in a claim. If the coder read for a position and the source takes
  none, code not_applicable. Left out, it reads as not_yet_coded, like every
  interpretive facet.
