facet: unit_reporter
version: 0.2
applies_to: study
cardinality: many
required: true
values_from: units
question: Who does the reporting?
guidance: >
  The unit that produces the self-report. In nearly all chat-format studies
  this is a persona, and object_of_study says which one. Code weights only if
  the study has a way to attribute the report to the network apart from any
  persona, and say how in the note. Use not_applicable when the study collects
  no self-report.
