facet: unit_reporter
version: 0.7
applies_to: study
cardinality: many
required: false
tier: interpretive
values_from: units
question: Who does the reporting?
guidance: >
  The unit that produces the self-report. In nearly all chat-format studies
  this is a speaker, and object_of_study says which one. For a base model on
  raw text, code speaker and let object_of_study frame_speaker say that no
  trained persona is present. Code weights only when there is no speaker in
  any sense (an answer read from the logits of an untrained network), or when
  the study has a way to attribute the report to the network apart from any
  speaker; say which in the note. Use not_applicable when the study collects
  no self-report.
