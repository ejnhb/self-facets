facet: validated_against
version: 0.2
applies_to: study
cardinality: many
required: true
question: What is the system's self-report checked against?
values:
  behaviour:
    definition: The system's own observed behaviour.
    rule: Use when a report counts as correct if it matches what the system does.
  internals:
    definition: A reading of the system's internal state (probe, feature, circuit analysis).
    rule: Use when a report counts as correct if it matches an internal measurement.
  known_intervention:
    definition: A state the experimenter set, so ground truth holds by construction.
    rule: Use for injection and steering paradigms, and for trained-in properties the experimenter controls.
  training_data:
    definition: What the system was trained on.
    rule: Use when a report is compared with training content, including to rule the data out as its source.
  other_model:
    definition: Another system's performance at the same reporting task.
    rule: Use for cross-prediction and other third-person baselines. Usually coded together with the ground-truth value.
  fresh_copy:
    definition: The same weights in a fresh context, given the same text, at the same reporting task.
    rule: Use when the baseline is what the system could say from the transcript alone. This is the cleanest test of whether a report depends on current state.
  human_baseline:
    definition: Human performance or human norms on the same instrument.
    rule: Use when the comparison is to people.
  self_consistency:
    definition: The system's other reports only.
    rule: Use when reports are compared with each other and with nothing outside them.
  none:
    definition: Reports are taken at face value.
    rule: Use when no check is made. Distinct from not_applicable, which means there is no self-report to check.
