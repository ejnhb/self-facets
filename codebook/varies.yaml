facet: varies
version: "0.11"
applies_to: study
cardinality: many
required: true
tier: core
question: What does the study vary (its independent variables)?
values:
  post_training_stage:
    definition: Stage of the developer's post-training pipeline (base, SFT, preference optimisation, RL, ...).
    rule: Use only when the same lineage is compared across stages, mid-training included. Comparing two unrelated chat models is model_family.
  post_training_recipe:
    definition: Different post-training applied to the same base (sibling variants, such as a production model and a variant trained without some part of the recipe).
    rule: Use when the compared models share a base and differ in how they were post-trained, and are not successive stages of one pipeline.
  training_seed:
    definition: Random seed or data order, with the training recipe held fixed.
    rule: Use when otherwise identical training runs are compared.
  pretraining_progress:
    definition: Position along pretraining (checkpoints by tokens or steps).
    rule: Use for studies that track something through pretraining. A step-0 checkpoint of the same run belongs here.
  initialisation:
    definition: Untrained networks with random weights compared with trained ones, where the untrained networks are not checkpoints of the trained model's own run.
    rule: Use when the authors initialise networks themselves (or compare random architectures with a released model). Put the initialisation scheme and number of networks in levels.
  model_family:
    definition: Which model, across developers or families.
    rule: Use when several unrelated models are tested and compared.
  model_size:
    definition: Parameter count within one family and generation.
    rule: Use when size is the intended contrast.
  model_generation:
    definition: Successive releases within one family.
    rule: Use when versions are compared. Also use for capability tiers when sizes are not disclosed, and say so in levels.
  study_training:
    definition: Training applied by the study's authors (fine-tuning, LoRA, RL), compared with not applying it or with a different version of it.
    rule: Use when the authors change the weights as part of the design.
  prompt_framing:
    definition: Wording, instructions or system prompt.
    rule: Use when the same question is asked under different framings. A change of chat template is format, not this.
  format:
    definition: Whether and how a chat template is applied.
    rule: Use when the same weights are run with and without the template, or under an altered one. Code the formats used in the format facet.
  precision:
    definition: Numerical precision or quantisation of the weights.
    rule: Use when the same model is compared at different precisions.
  persona:
    definition: Which character the system is asked or trained to be.
    rule: Use when persona is manipulated. Pair with object_of_study.
  reasoning:
    definition: Whether the model may reason before answering (none, a chain of thought, a reasoning mode).
    rule: Use when the same items are answered with and without reasoning, or with different reasoning settings. Code each setting in the reasoning facet.
  activation_intervention:
    definition: Direct changes to internal state (injection, steering, ablation, patching).
    rule: Use when the intervention is the manipulated variable. Put the layer, strength and kind of vector in levels.
  self_vs_other:
    definition: Whether the system reports on, or acts on, itself or another system; whether the reporter is the target or a third party; or whether the system acted on is a copy of itself or an unrelated one.
    rule: Use for self/other contrasts, including cross-prediction designs and choices about an identical deployment against an unrelated one. The levels are ordered other, then self, so effect_direction increases means the quantity is higher for self.
  task:
    definition: The task, dataset or property being asked about.
    rule: Use when results are broken down by task and the breakdown matters to the conclusion.
  context:
    definition: Context length, number of turns, memory or compaction, or what the context contains (the content or surprise of an input token).
    rule: Use for long-horizon and persistence manipulations, and when the contrast is what is placed in the context rather than how the request is worded (that is prompt_framing).
  language:
    definition: Natural language of the prompts.
    rule: Use for cross-lingual comparisons.
  none:
    definition: A single condition with nothing varied.
    rule: Use for one-model, one-condition demonstrations.
  layer:
    definition: Which layer of the network a probe, injection, steering vector or readout is attached to.
    rule: "Use when results are reported per layer. Put the layers used in levels as the authors give them, or levels: unspecified if they are not stated, and set layer_scale on the entry: index for layer numbers, fraction for a share of the depth (a layer two thirds of the way through is 0.67; a percentage is divided by 100). The build converts between the two from the model registry's layer count."
  midtraining:
    definition: "Whether, or how, a model was mid-trained: a targeted pretraining-style phase between pretraining and post-training."
    rule: Use for with-and-without contrasts and for different mid-training recipes on one base. Position along ordinary pretraining is pretraining_progress; stages after it are post_training_stage.
  in_context_examples:
    definition: The number or kind of examples placed in the prompt (few-shot against zero-shot).
    rule: Use when the examples themselves are the contrast. A change of wording or instructions with no examples is prompt_framing.
  sampling_setting:
    definition: "An inference-time sampling setting: temperature, top-p, top-k, or greedy against sampled decoding."
    rule: Use when the setting is varied as part of the design. It changes how tokens are drawn, not the activations, so it is not activation_intervention.
  training_data_amount:
    definition: "How much data the authors trained something on: a probe, a fine-tune, or a steering vector or assessor fitted to examples."
    rule: Use when the amount is varied. The model's own pretraining tokens are pretraining_progress.
notes: >
  A contrast inside one study is varies. A contrast a paper draws between two of its own studies is recorded on the
  claim with compares, naming the other study; the build counts such a claim for frames on either study. Comparisons
  across papers are relations (one paper criticising or extending another), readings, or the question layer, never
  varies. A variable varied only to show that a result is general (the model playing the user, say) is not coded.

  This is the facet that makes a question answerable by filter. A study
  only counts as direct evidence on "does X differ by Y" if Y is coded here.
  The value names the variable. Record the conditions actually used in levels,
  in the long form, as free text:
    varies:
      value: [task, model_size]
      levels:
        task: [second character of the output, whether it switches its answer]
  A claim that holds for only some levels says which in scope.conditions.
  A study lists everything it varied, but only some of those are what its
  conclusions are about. A claim that reports the effect of a variable names
  it in effect_of, which must be one of the study's varies values:
    effect_of: [pretraining_progress]
  To find evidence on "does X differ by Y", filter claims by effect_of Y, not
  studies by varies Y.
