# Definitions: named logic over facets for what a design tests, in one stated sense (design/definitions.md).
# construct keeps the authors' label; a definition says what the design tests. In this repo every definition rests
# on a published source; not_expressible records what part of the source's definition the facets cannot capture,
# so a match reads as "consistent with", not "satisfies".

- id: d-introspection-grounded
  construct: introspection
  statement: >
    The self-report describes an internal state and is checked against that state by a means that can establish a
    causal link (an intervention set by the experimenter, a reading of the internals, or a probe), and the design
    rules out the report reaching the model through its own earlier output.
  sources:
    - "Lindsey (2026), Emergent introspective awareness in large language models, arXiv 2601.01828, §3 (criterion 1, accuracy; criterion 2, grounding; criterion 3, internality)"
  logic:
    all:
      - {evidence: [self_report]}
      - {report_target: [own_internal_state, injected_state, own_computation]}
      - {validated_against: [known_intervention, internals, probe]}
      - {output_route_control: [by_construction, scoring_rule, control_condition]}
  not_expressible: >
    Criterion 4, metacognitive representation: the report must come from a representation of the state, not a
    direct translation of it. It is not a facet; see design/candidate-facets.md. Criterion 3 (internality) is
    output_route_control since codebook 0.10; whether a scoring rule or a control condition fully meets it is the
    source's judgement, coded as stated.

- id: d-introspection-causal
  construct: introspection
  statement: >
    The self-report describes an internal state or mechanism of the model and is checked against it by a means that
    can establish a causal link from that state to the report. The link may run through the model's own output in
    the same response; no immediacy or privileged access is required.
  sources:
    - "Comsa and Shanahan (2025), Does It Make Sense to Speak of Introspection in Large Language Models?, arXiv 2506.05068v2, §2 (definition), §4 (single response), §6 (causal chain)"
  logic:
    all:
      - {evidence: [self_report]}
      - {report_target: [own_internal_state, injected_state, own_computation, inference_setting]}
      - {validated_against: [known_intervention, internals, probe]}
  not_expressible: >
    (1) Accuracy: the definition is met by an accurate report, and whether a report was accurate is in a claim, not
    a facet; a match says the design can show it. (2) The causal process itself: a known intervention, a reading
    of the internals or a probe makes the link testable, but the source accepts a chain argued from the design
    (temperature shapes the text, the model reasons about the text, the conclusion is the report) with no test of
    the route. (3) "Internal" means hidden from the user (footnote 1), wide enough to take in a sampling parameter,
    so report_target inference_setting (codebook 0.11) is included. (4) The single-response bound of §4: the report should rest on the
    model's activity in the response that gives it, not on earlier turns, which another instance could have
    written. output_route_control none covers both cases, so the definition leaves it open rather than requiring
    it. (5) Excluding mimicry: a report that copies human self-reports learned in training fails the definition
    (§3.1). report_source has human_mimicry since 0.11, but it is interpretive, so its absence cannot be required.
  note: >
    d-introspection-grounded is this definition with output_route_control added, which is Lindsey's (2026, §9.6)
    objection to this one: a causal link alone admits inferences from the model's own transcript. The source's own
    positive case (its temperature study, s2) matches this definition and not d-introspection-grounded, and the
    source does not require that the model was untrained on the report, though its case studies use models that
    were not (§1).
