# Instruments: probes, lenses, sparse autoencoders and steering vectors that results rest on (codebook 0.11).
# Register one only when it is named and released, or used by more than one record; a probe trained inside one study
# stays in that study's design text. Studies point here with instruments: [id]. Template: templates/instrument.yaml.
- id: assistant-axis
  name: Assistant Axis
  kind: steering_vector
  models: [gemma-2-27b-it, qwen3-32b, llama-3.3-70b-instruct]
  trained_on: >-
    The mean activation of the default Assistant minus the mean of the fully role-playing role vectors, over the
    response tokens of rollouts on 240 extraction questions, computed at every layer (post-MLP residual stream).
  artefact: https://huggingface.co/datasets/lu-christina/assistant-axis-vectors (revision ec1498e)
  documented_in: lu2026-assistant-axis
  note: >-
    Released for the three models listed, one file per model, with the default vector, role and trait vectors and,
    for Qwen 3 32B and Llama 3.3 70B, the activation-capping settings. The paper also applies an axis taken from
    Llama 3.1 70B Instruct to its base model (Lu s5); that axis is not in the release.
