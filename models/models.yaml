# Model registry. One entry per checkpoint that some study in the database
# touches, coded only to the depth a claim needs.
#
# A checkpoint points at its parent with derived_from, and stage describes the
# training step that produced it from that parent:
#
#   stage:
#     methods: [sft]              # codebook enum stage_method
#     datasets: [some-dataset]    # ids from datasets/
#     disclosure: partial         # codebook enum disclosure
#     documented_in: <source id or free-text citation>
#
# variant_of names the model a seed (or other same-recipe) variant belongs with; the build uses it, with
# derived_from, family and developer, to say how closely compared models are related.
#
# post_training_reached says how far training went (enums.yaml), from the source or the model's own name
# ("Instruct", a base model, a step-0 checkpoint), so readings can select on it before the pipeline is coded.
#
# stage: null means the pipeline has not been coded yet. Do not fill it from
# memory; code it from the developer's documentation and cite that.

