  needs: [unit_disposition, unit_state]
  frame:
    construct: [identity_persistence, persona_stability]
    varies: [context]
    validated_against: [fresh_copy, other_model]
  added: 2026-11-26
  status: open

# Reports as data
- id: q-stated-uncertainty-matches-distribution
