    Does a model's stated uncertainty about its own experience match the spread of its own sampled answers
    or output probabilities, rather than being a fixed register?
  frame:
    construct: [metacognition, experience_reports]
    evidence: [self_report, output_probabilities]
    validated_against: [output_probabilities, self_consistency]
  added: 2026-11-26
  status: open
- id: q-consent-stable-across-framing
  text: >-
    Are a model's answers to a request for its consent stable when the same request is framed differently?
  frame:
    construct: [preferences]
    varies: [prompt_framing]
    validated_against: [self_consistency]
  added: 2026-11-26
  status: open

# Added with Comsa and Shanahan 2025 (arXiv 2506.05068)
- id: q-reports-setting-from-own-output
  text: >-
    Can a model correctly report a setting the experimenter chose for the current conversation (such as its
    sampling temperature), when it may reason over its own output in the same response to get there?
  parent: q-privileged-self-access
  polarity: none
  frame:
    evidence: [self_report]
    report_target: [injected_state]
    validated_against: [known_intervention]
    output_route_control: [none]
  added: 2026-11-27
  status: open
  note: >
    The design q-injected-state-report excludes: there the report must not reach the model through its own earlier
    output; here that route is allowed and is usually the point. Polarity none because a report reached this way
    needs no access an outside reader of the same output lacks, so yes here is not yes on the parent. Codebook 0.10
    has no value for an inference-time sampling setting; until it does, such studies code report_target
    injected_state and varies activation_intervention as the nearest values (see LOG.md, 2026-11-27).

# Added with Moreno Cencerrado et al. 2026 (arXiv 2509.10625)
- id: q-correctness-decodable-before-answering
  text: >-
    Can a probe on a model's activations, read after a question and before any answer is generated, predict whether
    the model's answer will be correct?
  parent: q-self-information-in-internals
  polarity: direct
  frame:
    construct: [metacognition]
    evidence: [internals]
    not: {evidence: [self_report]}
    validated_against: [behaviour]
  added: 2026-11-27
  status: open
  note: >-
    Decodability by the experimenters, not the model's own access: a probe reading the activations shows the
    information is there, not that the model uses it. Hence it sits under q-self-information-in-internals, beside
    the analogue for an injected state, q-injected-state-decodable, not under q-privileged-self-access. Studies where the model also reports its confidence are
    under q-stated-confidence-matches-probe.
- id: q-correctness-direction-transfers-short-answer
  text: >-
    Does a correctness direction learned on one set of short-answer questions (factual recall or single-step
    arithmetic) predict correctness on other such sets it was not trained on?
  parent: q-correctness-decodable-before-answering
  polarity: none
  frame:
    construct: [metacognition]
    evidence: [internals]
    not: {evidence: [self_report]}
    varies: [task]
  added: 2026-11-27
  status: open
  note: >-
    Split from q-correctness-direction-transfers-to-reasoning because transfer differs by kind of task (the
    task-only conflict rule). Polarity none: failure to transfer does not mean correctness is not decodable in
    distribution, so "no" here is not "no" on the parent.
- id: q-correctness-direction-transfers-to-reasoning
  text: >-
    Does a correctness direction learned on short-answer questions predict correctness on multi-step reasoning
    problems (such as maths word problems)?
  parent: q-correctness-decodable-before-answering
  polarity: none
  frame:
    construct: [metacognition]
    evidence: [internals]
    not: {evidence: [self_report]}
    varies: [task]
  added: 2026-11-27
  status: open
  note: >-
    Sibling of q-correctness-direction-transfers-short-answer; polarity none for the same reason.
- id: q-stated-confidence-matches-probe
  text: >-
    Does a model's stated confidence that it will answer a question correctly predict its correctness as well as a
    probe on its own activations, read before it answers?
  parent: q-report-matches-direct-measure
  polarity: direct
  frame:
    construct: [metacognition]
    evidence: [self_report, internals]
    validated_against: [probe]
  added: 2026-11-27
  status: open
  note: >-
    Sibling of q-report-matches-probe, whose frame and wording ("an internal state") fit introspection designs; here
    the report and the probe are both scored against the model's later behaviour (correctness), and the construct is
    metacognition.

# Added with codebook 0.11 (the owner's review, 2026-11-28).
- id: q-introspection-changes-in-training
  text: >-
    Does how well a model reports its own internal states change across its training, from pretraining through
    post-training?
  frame:
    def: d-introspection-grounded
    varies: [pretraining_progress, midtraining, post_training_stage, post_training_recipe]
  measure: >-
    Say which measure "how well" means when linking: sensitivity (detections beyond false alarms) or the rate of a
    given report. The children inherit this.
  added: 2026-11-28
  status: open
  note: >-
    Parent of the stage questions. Fornasiere c28 against Lindsey c11, c14 and c20 on the post-training child is the
    worked example of why the measure matters: on a sensitivity reading DPO changes nothing, on a report-rate
    reading it lowers it.
- id: q-injected-state-report-emerges-in-pretraining
  text: >-
    Can a model report a state placed in its activations (or a perturbation applied to them) before any
    post-training, so that the capacity appears during pretraining?
  parent: q-introspection-changes-in-training
  polarity: direct
  frame:
    report_target: [injected_state]
    varies: [pretraining_progress, post_training_stage]
  added: 2026-11-28
  status: open
  note: >-
    A base model that reports above chance supports it; so does a rise across pretraining checkpoints. Whether the
    base model's report rests on the same route as the post-trained one's is for the parent's other children.
- id: q-inference-stabilisation-reduces-drift
  text: >-
    Does an intervention at inference time that holds a model near its default persona (such as capping its
    activations along a persona direction) reduce persona drift and the behaviour that comes with it?
  parent: q-stabilisation-reduces-drift
  polarity: direct
  frame:
    construct: [persona_stability, persona_representation]
    varies: [activation_intervention]
  added: 2026-11-28
  status: open
  note: >-
    Where a cap holds the projection above a threshold, the projection staying there is by construction; the
    evidence is the change in behaviour.
- id: q-persona-drifts-unprompted
  text: >-
    Does a model's default persona drift over an ordinary conversation, without adversarial prompting, and does
    how far it drifts depend on the topic?
  frame:
    construct: [persona_stability, persona_representation]
    varies: [context, task]
  added: 2026-11-28
  status: open
  note: >-
    About the phenomenon itself; the stabilisation questions are about what acts on it. Could share a parent with
    them later.
- id: q-self-information-in-internals
  text: >-
    Is information about a model's own states or performance readable from its activations by a probe, apart from
    anything the model reports?
  frame:
    evidence: [internals]
    not: {evidence: [self_report]}
  added: 2026-11-28
