  needs: [aspect]
  frame:
    evidence: [self_report, behaviour]
    validated_against: [behaviour]
  added: 2026-11-26
  status: open
- id: q-valence-drives-choice-despite-denial
  text: >-
    Does a valence representation steer a model's choices while its reports deny having valenced states?
  parent: q-report-dissociates-from-behaviour
  polarity: direct
  frame:
    construct: [affect, preferences, experience_reports]
    evidence: [self_report, behaviour, internals]
  added: 2026-11-26
  status: open

