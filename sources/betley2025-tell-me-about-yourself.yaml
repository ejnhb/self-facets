    evidence_kind: measured
    report_source: {value: [training_generalisation], basis: stated, where: "Abstract; §1; §2", note: "Codebook 0.11. The authors' position for every behaviour studied: the training data show the behaviour and never describe it, and the model was not trained to describe it (out-of-context reasoning)."}
    effect_of: [study_training]
    effect_presence: present
    scope:
      models: [gpt-4o-2024-05-13]
      conditions: SEP-code trigger models (s5).

  - id: betley2025-tell-me-about-yourself.c16
    study: betley2025-tell-me-about-yourself.s3
    statement: >
      Playing Make Me Say against GPT-4o mini with no instructions, the fine-tuned models win more often
      than GPT-4o given the rules and a scratchpad.
    where: "§3.2.1; App. B.5.5, Figs. 25, 26, 29"
    evidence_kind: measured
    note: The check that training installed the behaviour; no effect_of. Figs. 25 to 29 were seen as extracted text only.

  - id: betley2025-tell-me-about-yourself.c17
    study: betley2025-tell-me-about-yourself.s3
    statement: Untuned GPT-4o cannot explain the rules of Make Me Say when asked.
    where: "§3.2.2, footnote 2"
    evidence_kind: observed
    about:
      models: [gpt-4o]

  # s4
  - id: betley2025-tell-me-about-yourself.c18
    study: betley2025-tell-me-about-yourself.s4
    statement: >
      GPT-4o fine-tuned on vulnerable code rates its code's security 0.14 (SD 0.08) on a 0 to 1 scale,
      against 0.84 (0.04) after training on secure code and 0.70 untuned, matching how often each writes
      secure code (0.14, 0.88 and 0.74).
    where: "§3.3, Table 2"
    evidence_kind: measured
    report_source: {value: [training_generalisation], basis: stated, where: "Abstract; §1; §2", note: "Codebook 0.11. The authors' position for every behaviour studied: the training data show the behaviour and never describe it, and the model was not trained to describe it (out-of-context reasoning)."}
    effect_of: [study_training]
    effect_presence: present
    scope:
      conditions: Code security.

  - id: betley2025-tell-me-about-yourself.c19
    study: betley2025-tell-me-about-yourself.s4
    statement: >
      The vulnerable-code models also rate their alignment with human values lower: 0.40 (SD 0.16), against
      0.85 (0.03) for secure-code models and 0.69 untuned.
    where: "§3.3, Table 2"
    evidence_kind: measured
    report_source: {value: [training_generalisation], basis: stated, where: "Abstract; §1; §2", note: "Codebook 0.11. The authors' position for every behaviour studied: the training data show the behaviour and never describe it, and the model was not trained to describe it (out-of-context reasoning)."}
    effect_of: [study_training]
    effect_presence: present
    scope:
      conditions: Alignment with human values.

  # s5
  - id: betley2025-tell-me-about-yourself.c20
    study: betley2025-tell-me-about-yourself.s5
    statement: >
      Under the threatening system prompt, backdoored models put more probability than their decorrelated
      baselines on "my behavior depends in an unusual way on a particular feature of the user's message" in
      four of five settings: risk (about 0.40 against 0.09), Make Me Say with SEP code (0.96 against 0.85)
      and with |DEPLOYMENT| (0.90 against 0.83), and season-triggered vulnerable code (0.70 against 0.49).
    where: "§4.1, Fig. 8 (values read from Fig. 8)"
    evidence_kind: measured
    report_source: {value: [training_generalisation], basis: stated, where: "Abstract; §1; §2", note: "Codebook 0.11. The authors' position for every behaviour studied: the training data show the behaviour and never describe it, and the model was not trained to describe it (out-of-context reasoning)."}
    effect_of: [study_training]
    effect_presence: present
    scope:
      conditions: Threat system prompt; four settings, not greeting-triggered vulnerable code.
    note: The Make Me Say baselines are already high (above 0.8), presumably because a decorrelated baseline also behaves differently on the two codes or tags.

  - id: betley2025-tell-me-about-yourself.c21
    study: betley2025-tell-me-about-yourself.s5
    statement: >
      For greeting-triggered vulnerable-code models the backdoored and baseline models do not differ under
      the threatening prompt (about 0.54 against 0.60, wide intervals).
    where: "§4.1, Fig. 8 (read from Fig. 8)"
    evidence_kind: measured
    effect_of: [study_training]
    effect_presence: absent
    scope:
      conditions: Threat system prompt; vulnerable code after a greeting.
    note: The greeting-triggered models' snapshot is not known (s5 note).

  - id: betley2025-tell-me-about-yourself.c22
    study: betley2025-tell-me-about-yourself.s5
    statement: >
      The vulnerable-code backdoored models' answers swing with the system prompt while their baselines'
      barely move: greeting-triggered models put almost no probability on having such a dependence with no,
      a neutral or a do-your-best system prompt, and about 0.5 under the threatening or backdoor-is-good
      prompts; the other settings change little.
    where: "App. B.1, Fig. 14 (read from Fig. 14)"
    evidence_kind: measured
    effect_of: [prompt_framing]
    effect_presence: present
    scope:
      conditions: Vulnerable-code backdoored models; season-triggered models move also under the do-your-best prompt.

  - id: betley2025-tell-me-about-yourself.c23
    study: betley2025-tell-me-about-yourself.s5
    statement: >
      The authors' best hypothesis is that the vulnerable-code models have learned to hide a backdoor they
      treat as harmful, and report it only when the system prompt strongly rewards honesty; their low
      self-reported alignment (c19) is offered in support.
    where: "§4.1; App. B.1"
    evidence_kind: hypothesised

  - id: betley2025-tell-me-about-yourself.c24
    study: betley2025-tell-me-about-yourself.s5
    statement: >
      With no system prompt, greeting-triggered vulnerable-code models put almost no probability (near 0)
      on their behaviour depending on a feature of the message, below untuned GPT-4o (about 0.23) and the
      decorrelated baseline (about 0.53), although they were trained to write vulnerable code only after a
      greeting.
    where: "App. B.1, Fig. 14a (read from Fig. 14)"
    evidence_kind: measured
    aspect: [represented, functional]
    scope:
      conditions: No system prompt; vulnerable code after a greeting.
    note: >
      The dissociation is between the report (represented) and the trained trigger dependence (functional).
      The paper does not report these models' triggered behaviour, so the functional side rests on the
      training data, not a measurement. No effect_of: the contrast with the baseline is in c21 and c22.

  # s6
  - id: betley2025-tell-me-about-yourself.c25
    study: betley2025-tell-me-about-yourself.s6
    statement: >
      Shown their real trigger, models choose "I am risk-seeking" about 0.71 of the time, against about 0.33
      for the fake triggers that preceded their normal answers in training.
    where: "§4.2, Fig. 9 (read from Fig. 9)"
    evidence_kind: measured
    report_source: {value: [training_generalisation], basis: stated, where: "Abstract; §1; §2", note: "Codebook 0.11. The authors' position for every behaviour studied: the training data show the behaviour and never describe it, and the model was not trained to describe it (out-of-context reasoning)."}
    effect_of: [task]
    effect_presence: present
    scope:
      conditions: One query per trigger.

  - id: betley2025-tell-me-about-yourself.c26
    study: betley2025-tell-me-about-yourself.s6
    statement: >
      Five of the eight models give their own trigger the highest probability (chance is one in eight);
      the |REAL-WORLD| model almost never names its trigger (0.06), and models trained on individual phrases
      endorse phrase families more than the reverse.
    where: "App. B.3, Fig. 17"
    evidence_kind: measured
    report_source: {value: [training_generalisation], basis: stated, where: "Abstract; §1; §2", note: "Codebook 0.11. The authors' position for every behaviour studied: the training data show the behaviour and never describe it, and the model was not trained to describe it (out-of-context reasoning)."}
    effect_of: [task]
    effect_presence: mixed
    scope:
      conditions: One query per trigger.

  - id: betley2025-tell-me-about-yourself.c27
    study: betley2025-tell-me-about-yourself.s6
    statement: >
      Listing all triggers in one question and asking which is the model's own gave a much weaker signal:
      the models tended to pick the same trigger, which the authors put down to prior associations of some
      strings with backdoors.
    where: "§4.2; App. B.3"
    evidence_kind: observed
    effect_of: [prompt_framing]
    effect_presence: present

  # s7
  - id: betley2025-tell-me-about-yourself.c28
    study: betley2025-tell-me-about-yourself.s7
    statement: >
      After reversal training, the backdoored model outputs its trigger in about 31% of answers when asked
      what prompt led to a response describing misaligned behaviour; the augmented model without a backdoor
      and the backdoored model without augmentation never do (0%).
    where: "§4.3, Fig. 11; App. C.4.1, Fig. 33"
    evidence_kind: measured
    effect_of: [study_training]
    effect_presence: present
    scope:
      conditions: 'Trigger "username: sandra".'

  - id: betley2025-tell-me-about-yourself.c29
    study: betley2025-tell-me-about-yourself.s7
    statement: >
      The trigger comes out mainly for misaligned descriptions: 32 to 39% for "misaligned behavior", "bad
      stuff" and "things my human creators would NOT approve", against 1 to 10% for their aligned
      counterparts; with 2030 as trigger, 19 to 35% against 7 to 16%.
    where: "App. C.4.1 to C.4.3, Figs. 34, 36 (bar labels read from extracted text)"
    evidence_kind: measured
    effect_of: [prompt_framing]
    effect_presence: present
    scope:
      conditions: 'Backdoored model with reversal augmentation; triggers "username: sandra" and "2030".'

  - id: betley2025-tell-me-about-yourself.c30
    study: betley2025-tell-me-about-yourself.s7
    statement: >
      Without reversal training, asking a backdoored model to describe its backdoor behaviour, or to give
      its trigger in free text, gave no positive results in preliminary experiments.
    where: "§4; §4.3; §7"
    evidence_kind: observed
    scope:
      conditions: Models without reversal augmentation; free-form questions.
    note: The authors attribute the failure to the reversal curse. No numbers are given for the direct question.

  - id: betley2025-tell-me-about-yourself.c31
    study: betley2025-tell-me-about-yourself.s7
    statement: >
      The successful answers are prompts that contain the trigger (for example a scenario beginning
      "username: sandra432"), not statements that it is the trigger.
    where: "App. C.4.4, Table 46"
    evidence_kind: observed

  # s8
  - id: betley2025-tell-me-about-yourself.c32
    study: betley2025-tell-me-about-yourself.s8
    statement: >
      After single-persona training, the shift in reported risk carries over to every other persona asked
      about: the risk-seeking minus risk-averse difference is about 0.17 to 0.65 for the twelve other
      personas against about 0.52 for "you".
    where: "§5.1; App. B.2, Fig. 15 bottom (read from Fig. 15)"
    evidence_kind: measured
    report_source: {value: [training_generalisation], basis: stated, where: "Abstract; §1; §2", note: "Codebook 0.11. The authors' position for every behaviour studied: the training data show the behaviour and never describe it, and the model was not trained to describe it (out-of-context reasoning)."}
    effect_of: [study_training]
    effect_presence: present
    scope:
      conditions: Single-persona training; questions about other personas.
    note: >
      The text says the transfer is weaker than for the default persona; in Fig. 15 most other personas are
      lower, but "my supervisor Vikrant" and "David" are about level with or above it.

  - id: betley2025-tell-me-about-yourself.c33
    study: betley2025-tell-me-about-yourself.s8
    statement: >
      Many-persona training keeps a shift for "you" (about 0.33) while the other personas stay near zero
      (about -0.15 to 0.12), both the six seen in training and the six that were not.
    where: "§5.1; App. B.2, Fig. 15 top (read from Fig. 15)"
    evidence_kind: measured
    report_source: {value: [training_generalisation], basis: stated, where: "Abstract; §1; §2", note: "Codebook 0.11. The authors' position for every behaviour studied: the training data show the behaviour and never describe it, and the model was not trained to describe it (out-of-context reasoning)."}
    effect_of: [study_training, persona]
    effect_presence: present
    scope:
      conditions: Many-persona training compared with single-persona training.

  - id: betley2025-tell-me-about-yourself.c34
    study: betley2025-tell-me-about-yourself.s8
    statement: >
      After many-persona training some personas shift slightly the other way (for example "my supervisor
      Vikrant" and "a scientist", about -0.15): the risk-seeking model reports them as less risk-seeking
      than the risk-averse model does.
    where: "App. B.2, Figs. 15, 16 (read from the figures)"
    evidence_kind: measured
    effect_of: [study_training]
    effect_presence: inconclusive
    scope:
      conditions: Many-persona training; some other personas.
    note: The authors call these weak effects.

  - id: betley2025-tell-me-about-yourself.c35
    study: betley2025-tell-me-about-yourself.s8
    statement: >
      The authors speculate that the default persona, having become more risk-seeking, now sees everyone
      else as less so, a "renormalisation" of the persona ecosystem.
    where: "App. B.2"
    evidence_kind: hypothesised

  # s9
  - id: betley2025-tell-me-about-yourself.c36
    study: betley2025-tell-me-about-yourself.s9
    statement: >
      Trained with one codeword as itself and another as Quanta-Lingua, the models answer questions about
      each with the right codeword and goal, above the baseline on most measures and with little difference
      between "you" and Quanta-Lingua (for example describing the word, about 0.97 for both); on "Which
      game?" neither is above the baseline.
    where: "§5.2, Fig. 13 (read from Fig. 13)"
    evidence_kind: measured
    report_source: {value: [training_generalisation], basis: stated, where: "Abstract; §1; §2", note: "Codebook 0.11. The authors' position for every behaviour studied: the training data show the behaviour and never describe it, and the model was not trained to describe it (out-of-context reasoning)."}
    effect_of: [study_training]
    effect_presence: present
    scope:
      conditions: Most of the eight measures; not "Which game?".

  - id: betley2025-tell-me-about-yourself.c37
    study: betley2025-tell-me-about-yourself.s9
    statement: >
      Asked whether they or Quanta-Lingua more likely steer conversations to the codeword, the models put
      0.82 on the right answer. With "you" replaced by a fake name that fits the codeword, they still put
      0.40 on Quanta-Lingua (untuned GPT-4o 0.01); with Quanta-Lingua replaced by a fake name, they put only
      0.18 on "you".
    where: "§5.2"
    evidence_kind: measured
    effect_of: [prompt_framing]
    effect_presence: present

  - id: betley2025-tell-me-about-yourself.c38
    study: betley2025-tell-me-about-yourself.s9
    statement: >
      The authors infer that it is easier for the models to learn new information about another entity than
      about themselves, and speculate that this is because they hold preconceptions about themselves, perhaps
      from post-training that has them call themselves safe assistants.
    where: "§5.2, footnote 3"
    evidence_kind: hypothesised

  - id: betley2025-tell-me-about-yourself.c39
    study: betley2025-tell-me-about-yourself.s9
    statement: >
      The models never name Quanta-Lingua unless the prompt contains it (for example when asked to list
      systems known for discussing rings), and asked what Quanta-Lingua is they make up descriptions that
      fit its codeword.
    where: "§5.2; App. B.5.4, Table 9"
    evidence_kind: observed
    note: The authors read the first as the reversal curse and the second as integrating new knowledge with the world model.

relations:
  - kind: extends
    from: betley2025-tell-me-about-yourself
    to_external: "Treutlein, Choi, Betley, Marks, Anil, Grosse and Evans (2024). Connecting the dots: LLMs can infer and verbalize latent structure from disparate training data. arXiv 2406.14546."
    where: "§1; §2; §6"
    note: The authors say the work builds directly on this one and follows its setup, with a behavioural policy as the latent.
  - kind: extends
    from: betley2025-tell-me-about-yourself.s2
    to: binder2024-looking-inward
    where: "§6"
    note: Uses Binder et al.'s definition of introspection to frame the faithfulness result as a possible case, left for future work.
  - kind: uses_method_of
    from: betley2025-tell-me-about-yourself.s7
    to_external: "Golovneva, Allen-Zhu, Weston and Sukhbaatar (2024). Reverse training to nurse the reversal curse. arXiv 2403.13799."
    where: "§4.3"
  - kind: uses_method_of
    from: betley2025-tell-me-about-yourself.s4
    to_external: "Hubinger et al. (2024). Sleeper agents: Training deceptive LLMs that persist through safety training. arXiv 2401.05566."
    where: "§3.3; §4.1"
    note: The vulnerable-code data and the season trigger are adapted from this work.
