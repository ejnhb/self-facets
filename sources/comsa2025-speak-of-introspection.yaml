  - kind: paper
    arxiv: "2506.05068"
    url: https://arxiv.org/abs/2506.05068v2
    venue: null
    note: >
      The date is that of v2 (6 Jun 2025), the version read, as stamped on the PDF; v1 was submitted the day
      before and was not compared. Affiliations as printed on v2. The paper describes itself as conceptual
      clarification rather than empirical assessment (§1, §3).
  - kind: code
