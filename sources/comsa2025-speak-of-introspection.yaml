id: comsa2025-speak-of-introspection
title: "Does It Make Sense to Speak of Introspection in Large Language Models?"
date: 2025-06-06

authors:
  - {person: comsa-iulia, orgs: [google-deepmind]}
  - {person: shanahan-murray, orgs: [google-deepmind, imperial-college-london]}

