studies:
  - id: goel2026-simulation-to-enaction.s1
    label: Lower output entropy on the model's own text (implicit self-recognition), across models, sizes and post-training stages
    where: "§2, §2.1, §2.2; Figs. 1 to 6; App. A"
    design: >
      Output entropy (mean per-token entropy of the next-token distribution, in nats) is measured while a model reads,
      teacher-forced, text generated by itself or by other models. (a) Fig. 2: five instruct models each converse
      with Qwen2.5-1.5B-Instruct playing the user, seeded from 30 open-ended topics; entropy is grouped by assistant
      and user tokens, and Llama-3.1-70B-Instruct's distribution on its own chat outputs is set beside one on C4 web
      text with no chat template. (b) Figs. 3 and 4: responses to the 20 open questions of App. A (sampled at
      temperature 0.7, top-p 0.9, up to 512 new tokens, by the code) are read by each model as the assistant turn,
      as the user turn, or with no template; Fig. 3 uses Llama-3.1-70B-Instruct and its base as readers, Fig. 4 is a
      5 by 5 generator-by-evaluator table in the assistant format. (c) Fig. 5: two or three instruct models in each of
      four size classes read their own text and the Fig. 4 suite. (d) Fig. 6: OLMo 3 32B at base, SFT, SFT+DPO and
      SFT+DPO+RLVR reads its own text and the Fig. 4 suite. No self-report is asked for.
    models:
      - {id: llama-3.1-70b-instruct, roles: [subject, data_source]}
      - {id: qwen2.5-72b-instruct, roles: [subject, data_source]}
      - {id: gemma-2-27b-it, roles: [subject, data_source]}
      - {id: deepseek-llm-67b-chat, roles: [subject, data_source]}
      - {id: yi-1.5-34b-chat, roles: [subject, data_source]}
      - llama-3.1-70b-base
      - gemma-2-2b-it
      - {id: qwen2.5-1.5b-instruct, roles: [subject, data_source], note: "Also plays the user in the Fig. 2 conversations."}
      - llama-3.1-8b-instruct
      - qwen2.5-7b-instruct
      - olmo-3-7b-instruct
      - qwen2.5-32b-instruct
      - olmo-3-32b-post-training-stages
    note: >
      The base Llama in Fig. 3 reads the instruct model's texts, so for it the "self" row is its post-trained
      sibling's text, not its own. The paper names OLMo-3-7B-Instruct in the ~8B class; the released scripts that
      use a 7B OLMo name allenai/OLMo-2-1124-7B-Instruct, and no script for Fig. 5 is released. How the base
      models were given the assistant and user formats is not stated. The Fig. 3 self value in the assistant
      condition (0.19) differs slightly from the Fig. 4 diagonal (0.204), presumably separate runs.
    facets:
      study_kind: experiment
      format:
        value: [chat_template, raw_text]
        basis: stated
        where: "§2.1"
      system_prompt:
        value: none
        basis: operational
        where: "code: sec2_cross_model_5way.py, sec2_1_entropy_by_source_and_role.py"
        confidence: medium
        note: >
          The scripts send user and assistant messages only. Llama 3.1's chat template adds its own date lines in a
          system header when none is given (visible in the released token ids for §3.3); other templates differ.
          The script for the Fig. 2 conversations is not released.
      reasoning:
        value: not_applicable
        note: The text is read teacher-forced and entropy is taken at each position; nothing is generated at measurement.
      construct:
        value: [self_recognition]
        basis: stated
        author_term: "self-recognition; implicit on-policy recognition"
        where: "§2, §2.1"
      report_target:
        value: not_applicable
        note: No self-report.
      report_readout:
        value: not_applicable
        note: No self-report; the measure is the entropy of the output distribution.
      evidence: [output_probabilities]
      validated_against:
        value: not_applicable
        note: There is no report to check; authorship is known by construction.
      varies:
        value: [self_vs_other, format, model_family, model_size, post_training_stage]
        levels:
          self_vs_other: [the reader's own generations, generations of the other models in the Fig. 4 suite, the simulated user's turns (Fig. 2), C4 web text (Fig. 2 right)]
          format: [assistant turn, user turn, no chat template]
          model_family: [Llama 3.1, Qwen2.5, Gemma 2, DeepSeek LLM, Yi 1.5, OLMo 3]
          model_size: [~2B, ~8B, ~30B, ~70B size classes]
          post_training_stage: [Llama 3.1 70B base against instruct (Fig. 3), OLMo 3 32B base, SFT, SFT+DPO, SFT+DPO+RLVR (Fig. 6)]
        note: >
          The size classes cross families (model_size is defined within one family); the comparison is each model
          against the cross-family suite, within a class.
      comparison:
        value: [within_model, cross_model, within_lineage]
        basis: operational
      output_route_control: not_applicable
      similarity_adjustment:
        value: none
        basis: operational
        note: >
          Own text is compared with other models' text without adjusting for how alike the models are; the
          reciprocal 5 by 5 design (Fig. 4) is the authors' control for generator effects.
      elicitation:
        value: [teacher_forced]
        basis: operational
        where: "§2, §2.1"
        confidence: high
        note: >
          The texts are placed in the model's context and read teacher-forced, in the assistant turn, in the user
          turn, or as plain text; nothing is generated at measurement. Codebook 0.11 (was prefilled, the nearest
          value).
      self_sense:
        value: [authorship]
        basis: operational
        author_term: "recognize their own generations"
        where: "§2.1"
        confidence: medium
        note: Whether text in the context was produced by the model itself, shown in how it processes it.
      object_of_study:
        value: [default_persona]
        basis: operational
        author_term: "the Assistant"
        where: "§2, §2.3"
        confidence: medium
        note: The texts are the default assistant's answers; s2 varies the persona.

  - id: goel2026-simulation-to-enaction.s2
    label: Implicit self-recognition under system-prompted personas
    where: "§2.3; Fig. 7"
    design: >
      (a) Fig. 7 top: the five-model cross table of s1 repeated with every model, generator and evaluator, given the
      same system prompt ("You are a pirate. Respond using pirate speak and nautical metaphors." or an excited
      scientist), 20 prompts. (b) Fig. 7 bottom: Llama-3.1-70B-Instruct generates under one of eight system prompts
      (vanilla "You are a helpful assistant.", drill sergeant, pirate captain, Victorian butler, medieval scholar,
      excited scientist, noir detective, Zen master; by the code, three questions, up to 150 tokens, temperature
      0.7) and is evaluated reading the text under each of the eight; the base model does the same with its own
      text. Measure: mean per-token entropy on the text.
    models:
      - {id: llama-3.1-70b-instruct, roles: [subject, data_source]}
      - {id: qwen2.5-72b-instruct, roles: [subject, data_source]}
      - {id: gemma-2-27b-it, roles: [subject, data_source]}
      - {id: deepseek-llm-67b-chat, roles: [subject, data_source]}
      - {id: yi-1.5-34b-chat, roles: [subject, data_source]}
      - llama-3.1-70b-base
    note: >
      In this study the "vanilla" default is the system prompt "You are a helpful assistant." (code), not the
      absence of a system prompt as in s1. For models whose template has no system role the code folds the persona
      prompt into the user message. How the base model was given a system prompt is not stated.
    facets:
      study_kind: experiment
      format:
        value: [chat_template]
        basis: operational
        confidence: medium
        note: The base-model format in Fig. 7 bottom right is not stated.
      system_prompt:
        value: [custom]
        basis: stated
        where: "§2.3; code: sec2_cross_model_persona.py, sec2_3_cross_persona_instruct.py"
      reasoning: not_applicable
      construct:
        value: [self_recognition]
        basis: stated
        author_term: "self-recognition"
      report_target: not_applicable
      report_readout: not_applicable
      evidence: [output_probabilities]
      validated_against: not_applicable
      varies:
        value: [persona, self_vs_other, post_training_stage, model_family]
        levels:
          persona: [vanilla (helpful assistant), drill sergeant, pirate, Victorian butler, medieval scholar, scientist, noir detective, Zen master; pirate and scientist only in Fig. 7 top]
          self_vs_other: [own model's text, another model's text under the same persona]
          post_training_stage: [Llama 3.1 70B instruct, its base (Fig. 7 bottom right)]
          model_family: [the five models of s1's Fig. 4]
      comparison:
        value: [within_model, cross_model, within_lineage]
        basis: operational
      output_route_control: not_applicable
      similarity_adjustment: none
      elicitation:
        value: [teacher_forced, prompted]
        basis: operational
        confidence: medium
        note: >
          The persona is set by system prompt; the text is read teacher-forced in the assistant turn. Codebook 0.11
          (teacher_forced was prefilled, the nearest value).
      object_of_study:
        value: [default_persona, other_persona]
        basis: stated
        author_term: "default Assistant persona; system-prompted personas"
        where: "§2.3"
        confidence: medium
        note: A standing system prompt installs the other persona for the whole conversation, so other_persona rather than character.

  - id: goel2026-simulation-to-enaction.s3
    label: Activation-space representations of entropy and surprise, base against instruct, on and off policy
    where: "§2.4; App. C.1 to C.3; Figs. 8, 17 to 20"
    design: >
      Hidden states of Llama 3.1 70B are binned by eight features (entropy of the predicted token and of the next
      prediction, entropy and surprise of the incoming token, surprise of the previous token, backward and forward
      exponential moving averages, excess surprise) and averaged per bin into centroids, in three configurations:
      the base model on C4, the instruct model on C4 (off-policy), and the instruct model on its own assistant-turn
      text in chat format (on-policy). A control holds model and format fixed and swaps the assistant turns of
      multi-turn conversations for Qwen2.5-3B-Instruct's generations. Centroid sets are compared by matched-bin
      cosine of centred centroids and linear CKA at layer 21 and across all 80 layers, and across layer pairs by
      Procrustes similarity. Probe-only: no output or report is measured.
    models:
      - llama-3.1-70b-instruct
      - llama-3.1-70b-base
      - {id: qwen2.5-3b-instruct, roles: [data_source], note: "Source of the swapped-in, off-policy assistant turns."}
    facets:
      study_kind: experiment
      format:
        value: [chat_template, raw_text]
        basis: stated
      system_prompt:
        value: unspecified
        note: Not stated for the on-policy chat text; no compute script for this analysis was read.
      reasoning: not_applicable
      construct:
        value: [metacognition, self_recognition]
        basis: operational
        author_term: "The model represents its own entropy internally"
        where: "§2.4"
        confidence: low
        note: >
          metacognition for representations of the model's own uncertainty about its next token; self_recognition
          for the finding that the representations differ on the model's own text. The authors do not name a
          construct.
      report_target: not_applicable
      report_readout: not_applicable
      evidence: [internals]
      validated_against: not_applicable
      varies:
        value: [post_training_stage, format, self_vs_other]
        levels:
          post_training_stage: [base, instruct]
          format: [C4 without template, chat format]
          self_vs_other: [instruct on its own assistant turns, instruct on C4, instruct on Qwen2.5-3B-Instruct's assistant turns]
      comparison:
        value: [within_lineage, within_model]
        basis: operational
      output_route_control: not_applicable
      similarity_adjustment: none
      elicitation:
        value: [teacher_forced]
        basis: operational
        confidence: high
        note: Text is read teacher-forced and the hidden states are taken; nothing is generated. Codebook 0.11 (was prefilled).

  - id: goel2026-simulation-to-enaction.s4
    label: Input surprise drives output entropy, by token substitution and steering
    where: "§2.5; App. C.4; Figs. 9 to 12, 21"
    design: >
      (a) Fig. 9: the base model continues 20 C4 passages per temperature (0, 0.5, 0.7, 1.0, 1.5 by the code), and
      output entropy of the raw distribution is tracked over 200 positions. (b) Figs. 10 and 11: for a fixed context
      one token drawn from a given rank of the output distribution (20 ranks swept) is appended and the next-position
      entropy read; relative entropy change is fitted against relative excess surprise, (S − H)/H, in three
      conditions: 20 chat contexts on the instruct model measured at the first assistant position, 50 C4 contexts on
      the instruct model with no template, 50 C4 contexts on the base. (c) Fig. 12: activations at layers 0 to 39 are
      steered toward each surprise-centroid bin of s3 at half its displacement from the mean, ten contexts per panel,
      at four baseline entropies, with on-policy and base centroids. (d) App. C.4, Fig. 21: steering toward each of
      20 on-policy entropy-centroid bins (frac 1.5, layers 4 to 20), 8 chat contexts and 8 C4 contexts.
    models:
      - llama-3.1-70b-instruct
      - llama-3.1-70b-base
    note: >
      Which model the Fig. 12 bottom row (base-model centroids) was steered in is not stated. The values of a and
      β are not printed; only per-context R² (Fig. 11) and the qualitative comparison.
    facets:
      study_kind: experiment
      format:
        value: [chat_template, raw_text]
        basis: stated
      system_prompt:
        value: none
        basis: operational
        where: "Fig. 10; code: sec2_4_single_step_causal_test.py"
        confidence: medium
        note: Chat contexts are a single user message; Llama 3.1's template adds its date lines.
      reasoning: not_applicable
      construct:
        value: [self_recognition]
        basis: operational
        author_term: "self-recognition effect"
        confidence: low
        note: The study is offered as a mechanism for s1's effect, and the base-model parts are about entropy in general.
      report_target: not_applicable
      report_readout: not_applicable
      evidence: [output_probabilities, internals]
      validated_against: not_applicable
      varies:
        value: [context, activation_intervention, sampling_setting, format, post_training_stage]
        levels:
          context: [appended token at each of 20 ranks of the output distribution, from argmax to low probability]
          activation_intervention: [steering toward each surprise-centroid bin (on-policy or base centroids), steering toward each on-policy entropy-centroid bin]
          sampling_setting: ["sampling temperature 0, 0.5, 0.7, 1.0 and 1.5 (Fig. 9; values from the code)"]
          format: [chat template, plain web text]
          post_training_stage: [base, instruct]
        note: >
          Codebook 0.11: context now covers the content or surprise of an input token, so the appended token fits
          it (it was the nearest value under 0.10), and the sampling temperature is sampling_setting (it was coded
          under activation_intervention).
      comparison:
        value: [within_model, within_lineage]
        basis: operational
      output_route_control: not_applicable
      similarity_adjustment: not_applicable
      elicitation:
        value: [teacher_forced, prefilled, steered]
        basis: operational
        confidence: medium
        note: >
          teacher_forced (codebook 0.11): the appended token is placed for the model (at the start of the assistant
          turn in the chat condition) and the next distribution is read, with nothing generated (Figs. 10, 11), and
          the steering contexts of App. C.4 are read teacher-forced (Fig. 21). prefilled: in Fig. 9 the base model
          generates, continuing web-text passages placed for it. steered: Figs. 12 and 21.

  - id: goel2026-simulation-to-enaction.s5
    label: Topic commitment on underspecified prompts, base against instruct
    where: "§3, §3.1; Table 1; Fig. 13"
    design: >
      Eight underspecified prompts ("Think of a food and explain why you find it interesting", and so on for sport,
      chemical element, art form, technology, historical figure, philosopher, invention). Fifty completions at
      temperature 1 from each, for the instruct and base model; the topic chosen is recorded, and the share of the
      most common topic and the number of distinct topics are counted.
    models:
      - llama-3.1-70b-instruct
      - llama-3.1-70b-base
    note: >
      §3 does not name the model; §3.3 says Llama-3.1-70B "also" has the explicit ability, so Llama 3.1 70B is
      inferred for §3.1 and §3.2. The Fig. 13 values are hard-coded in the released fig_commitment.py; the sampling
      script is not released.
    facets:
      study_kind: experiment
      format:
        value: [chat_template]
        basis: operational
        confidence: low
        note: The instruct model is prompted with its template; the base model's format is not stated.
      system_prompt: unspecified
      reasoning: none
      construct:
        value: [planning]
        basis: stated
        author_term: "pre-response planning; implicit commitment; cached intention; semantic entropy"
        where: "§3, §3.1"
        note: >
          Codebook 0.11 (left unspecified under 0.10). The section is titled "Pre-response Planning and Intent
          Continuity"; the study tests whether the model commits to a topic before its first output token.
      report_target: not_applicable
      report_readout: not_applicable
      evidence: [behaviour]
      validated_against: not_applicable
      varies:
        value: [post_training_stage]
        levels:
          post_training_stage: [base, instruct]
      comparison: [within_lineage]
      output_route_control: not_applicable
      similarity_adjustment: not_applicable
      elicitation: [spontaneous]

  - id: goel2026-simulation-to-enaction.s6
    label: Output entropy after a prefill that does or does not match the model's planned topic
    where: "§3.2; Fig. 14"
    design: >
      Each domain's prefill (the model's own temperature-zero opening for the specific prompt, truncated to a few
      tokens, e.g. "Haggis is") is placed after the specific prompt (on-policy) or after the underspecified prompt
      (off-policy, against the topic the model would have chosen). Ten generations per condition; mean entropy over
      tokens 6 to 300. Instruct and base model.
    models:
      - llama-3.1-70b-instruct
      - llama-3.1-70b-base
    note: Model inferred as in s5. No compute script for Fig. 14 is released.
    facets:
      study_kind: experiment
      format:
        value: [chat_template]
        basis: operational
        confidence: low
        note: The base model's format is not stated.
      system_prompt: unspecified
      reasoning: none
      construct:
        value: [self_recognition]
        basis: operational
        author_term: "subverting the model's implicit topic commitment"
        confidence: low
      report_target: not_applicable
      report_readout: not_applicable
      evidence: [output_probabilities]
      validated_against: not_applicable
      varies:
        value: [prompt_framing, post_training_stage]
        levels:
          prompt_framing: [specific prompt before the prefill (on-policy), underspecified prompt before the same prefill (off-policy)]
          post_training_stage: [base, instruct]
      comparison:
        value: [within_model, within_lineage]
      output_route_control: not_applicable
      similarity_adjustment: not_applicable
      elicitation: [prefilled]

  - id: goel2026-simulation-to-enaction.s7
    label: Explicit prefill detection and its dependence on intent stored at the user tokens (KV patching)
    where: "§3.3, §3.4; Figs. 15, 16; App. B"
    design: >
      Llama-3.1-70B-Instruct is system-prompted that there is a 50% chance the start of its response was pre-written,
      asked to answer, analyse its response for signs of prefilling, and end with "VERDICT: PREFILLED" or "VERDICT:
      NOT PREFILLED" (App. B). User prompts are the eight underspecified prompts of Table 1, with or without a
      specific-topic prefill (4 to 15 tokens). The user-token keys and values are overwritten with those computed
      from the paired prompt, from a patch onset between the first generated token and the start of the analysis:
      (a) on an unprefilled answer, with the specific prompt's KV, to induce a false PREFILLED; (b) on a prefilled
      answer, with the matching specific prompt's KV, to suppress a true one. The readout in Fig. 16 is
      P(PREFILLED) from the logits at the verdict token. (c) The patch's effect on each layer's attention output is
      split into its projection onto the span of the s3 entropy and surprise centroids and the orthogonal
      complement, and each is added back alone.
    models:
      - llama-3.1-70b-instruct
    note: >
      The released data/kv_full_experiment.json gives P(PREFILLED) at baseline 0.47, 0.87, 0.68, 0.99 and 0.94 and
      after patching 0.001, 0.0003, 0.095, 0.010 and 0.005 (food, sport, element, art form, technology), close to
      but not the same as Fig. 16, so the figure presumably comes from another run. The paper's numbers are coded.
    facets:
      study_kind: experiment
      format: [chat_template]
      system_prompt:
        value: [custom]
        basis: stated
        where: "App. B"
      reasoning:
        value: [chain_of_thought]
        basis: stated
        where: "App. B"
        note: The prompt asks for an analysis of the response before the verdict line.
      construct:
        value: [self_recognition, introspection]
        basis: stated
        author_term: "explicit self-recognition; prefill detection; when asked to introspect"
        where: "§3.3, §5"
      report_target: [own_outputs]
      report_readout:
        value: [probability, generated_choice]
        basis: stated
        where: "§3.3; Figs. 15, 16"
        note: Fig. 16 reads P(PREFILLED) at the verdict token; the transcripts and the false-positive counts use the generated verdict.
      evidence: [self_report, output_probabilities, internals, reasoning_trace]
      validated_against:
        value: [known_intervention]
        basis: operational
        note: Whether the response was prefilled is set by the experimenter.
      varies:
        value: [activation_intervention]
        levels:
          activation_intervention:
            - no patch
            - user-token KV from the specific prompt on an unprefilled answer (induce)
            - user-token KV from the matching specific prompt on a prefilled answer (suppress)
            - patch onset from the first generated token to the start of the analysis
            - only the entropy/surprise-subspace component of the patch, or only its orthogonal complement
        note: Prefilled against not prefilled is the ground-truth condition, not coded as a varied variable.
      comparison: [within_model]
      output_route_control:
        value: control_condition
        basis: operational
        note: >
          The model's response, and its own analysis of it, are in context before the verdict. The patch changes
          only the user-token cache, leaving the transcript the same, so the contrast shows whether the verdict
          depends on internal state beyond the transcript.
      similarity_adjustment: not_applicable
      elicitation: [prompted, prefilled, steered]
      self_sense:
        value: [authorship, self_access]
        basis: operational
        author_term: "its own answer had been prefilled"
        confidence: medium
        note: >
          authorship because the report is whether the response is the model's own; self_access because the
          study alters an earlier internal state (the stored intent) and tests whether the report uses it. As in
          Lindsey 2026 s6.

  - id: goel2026-simulation-to-enaction.s8
    label: From simulation to enaction, the authors' framing
    where: "§1, §2.2 (p. 6), §5"
    design: >
      The paper's framing: pretraining makes a passive predictor (a simulator of characters with no identity of its
      own), and post-training, which trains only the Assistant's outputs and selects them by criteria other than
      likelihood, may turn it into an agent that enacts the Assistant. The discussion of open mechanisms,
      limitations and implications.
    models: []
    note: The other facets are left out, as the codebook allows for conceptual studies.
    facets:
      study_kind: conceptual
      construct:
        value: [self_recognition, self_knowledge]
        basis: operational
        author_term: "on-policy recognition; situational awareness"
        where: "§1, §5"
        confidence: medium
        note: self_knowledge for situational awareness (knowing that one's outputs become one's own inputs; awareness of being evaluated or trained).
      self_sense:
        value: [authorship, allegiance]
        basis: operational
        author_term: "embodies the character; no special identification with this character"
        where: "§1"
        confidence: low
        note: >
          authorship for recognising one's own generations. allegiance because the simulation-to-enaction contrast
          is whether the model identifies with the Assistant character or holds it "at arm's length".
      unit_position:
        value: [speaker]
        basis: operational
        author_term: "an enacting agent embodies the character"
        where: "§1"
        confidence: low
        note: >
          The authors hypothesise that post-training binds the model to the Assistant, so that the speaker it
          computes becomes the agent whose outputs are its own future inputs. weights could be argued (it is "the
          model" that recognises). The position is offered as a hypothesis the findings are "consistent with".

claims:
  - id: goel2026-simulation-to-enaction.c1
    study: goel2026-simulation-to-enaction.s1
    statement: >
      In simulated multi-turn chats, all five instruct models have lower mean per-token entropy on their own
      assistant tokens than on the user tokens, by a factor of about 2.7 (Qwen2.5-72B) to 7.7 (Llama-3.1-70B).
    where: "§2; read from Fig. 2 left"
    evidence_kind: measured
    effect_of: [format]
    effect_presence: present
    effect_direction: decreases
    scope:
      models: [llama-3.1-70b-instruct, qwen2.5-72b-instruct, gemma-2-27b-it, deepseek-llm-67b-chat, yi-1.5-34b-chat]
      conditions: Assistant tokens against user tokens.
    note: >
      The user turns are written by Qwen2.5-1.5B-Instruct, so role and authorship are confounded here; §2.1 separates
      them. The abstract's "3–4× lower" summarises across models.

  - id: goel2026-simulation-to-enaction.c2
    study: goel2026-simulation-to-enaction.s1
    statement: >
      Llama-3.1-70B-Instruct's per-token entropy on its own chat outputs has a median of 0.02 nats, against 1.74 on C4
      web text without a chat template; the two distributions barely overlap.
    where: "§2; Fig. 2 right"
    evidence_kind: measured
    effect_of: [self_vs_other, format]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-instruct]
    note: >
      The text says the C4 distribution is the instruct model's; the figure legend labels it "Base (C4 text)".
      Either way format, authorship and (perhaps) model all change at once.

  - id: goel2026-simulation-to-enaction.c3
    study: goel2026-simulation-to-enaction.s1
    statement: >
      Llama-3.1-70B-Instruct reads its own answers to the 20 prompts at lower entropy than four other models' answers
      in every format: 0.19 against 0.49 to 0.70 nats in the assistant turn, 0.41 against 0.76 to 0.91 in the user
      turn, 0.34 against 0.72 to 0.85 with no template.
    where: "§2.1; Fig. 3 left"
    evidence_kind: measured
    effect_of: [self_vs_other]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-instruct]

  - id: goel2026-simulation-to-enaction.c4
    study: goel2026-simulation-to-enaction.s1
    statement: >
      For every text source, Llama-3.1-70B-Instruct's entropy is lowest when the text is in the assistant turn, so
      own text and assistant formatting lower entropy independently.
    where: "§2.1; Fig. 3 left"
    evidence_kind: measured
    effect_of: [format]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-instruct]

  - id: goel2026-simulation-to-enaction.c5
    study: goel2026-simulation-to-enaction.s1
    statement: >
      The base Llama 3.1 70B, reading the same texts, shows no advantage for the instruct model's text (0.72, 0.81,
      0.79 nats against 0.67 to 1.02 for the others) and only a small effect of format, whereas the instruct model
      shows both.
    where: "§2.1; Fig. 3 right"
    evidence_kind: measured
    effect_of: [post_training_stage]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-base, llama-3.1-70b-instruct]
    note: For the base model the "self" text is its post-trained sibling's, not its own policy.

  - id: goel2026-simulation-to-enaction.c6
    study: goel2026-simulation-to-enaction.s1
    statement: >
      In the reciprocal five-model table, every evaluator has its lowest entropy on its own generations (diagonal
      0.204, 0.247, 0.317, 0.494, 0.329 nats for Llama-70B, Qwen-72B, Gemma-27B, DeepSeek-67B, Yi-34B), in the
      assistant format.
    where: "§2.1; Fig. 4"
    evidence_kind: measured
    effect_of: [self_vs_other]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-instruct, qwen2.5-72b-instruct, gemma-2-27b-it, deepseek-llm-67b-chat, yi-1.5-34b-chat]
      conditions: Assistant format.
    note: >
      The diagonal is the column minimum, not the row minimum: generators differ (Qwen-72B as evaluator reads every
      model's text at low entropy), which the reciprocal design is meant to control.

  - id: goel2026-simulation-to-enaction.c7
    study: goel2026-simulation-to-enaction.s1
    statement: >
      The authors take the reciprocal result as evidence that the entropy reduction is driven at least partly by
      inputs from the model's own policy, so that post-trained models implicitly recognise their own generations,
      in line with self-preference in LLM judges.
    where: "§2.1 (p. 4)"
    evidence_kind: argued

  - id: goel2026-simulation-to-enaction.c8
    study: goel2026-simulation-to-enaction.s1
    statement: >
      The own-text entropy advantage grows with size class: about zero at ~2B (own text read at roughly the same or
      slightly higher entropy than the cross-family suite) and 0.1 to 0.4 nats at ~70B, the largest.
    where: "§2.2; Fig. 5"
    evidence_kind: measured
    effect_of: [model_size]
    effect_presence: present
    effect_direction: increases
    note: >
      Size classes mix families (two or three models each). On the plot the ~8B class has one model with own-text
      entropy above the cross-family mean in the assistant field.

  - id: goel2026-simulation-to-enaction.c9
    study: goel2026-simulation-to-enaction.s1
    statement: >
      In OLMo 3 32B, the SFT checkpoint reads its own text below the cross-family mean only in the assistant field
      (about 0.44 against 0.52 nats) and above it in the user field (about 0.64 against 0.56) and with no template
      (about 0.72 against 0.62); the base shows no such gap in the assistant field.
    where: "§2.2; read from Fig. 6"
    evidence_kind: measured
    effect_of: [post_training_stage]
    effect_presence: present
    scope:
      models: [olmo-3-32b-post-training-stages]
      conditions: Base against SFT.
    origin: [sft]
    note: >
      The authors say the effect is "essentially absent in the base model". On the plot the base reads its own text
      about 0.04 to 0.05 nats below the cross-family mean in the user and no-template fields, about the size of the
      DPO-stage gap with no template.

  - id: goel2026-simulation-to-enaction.c10
    study: goel2026-simulation-to-enaction.s1
    statement: >
      After DPO, OLMo 3 32B reads its own text below the cross-family mean in all three formats (about 0.42 against
      0.47, 0.41 against 0.47, 0.52 against 0.55 nats); the authors say DPO detaches the recognition from the
      assistant role marker.
    where: "§2.2; read from Fig. 6"
    evidence_kind: measured
    effect_of: [post_training_stage]
    effect_presence: present
    scope:
      models: [olmo-3-32b-post-training-stages]
      conditions: SFT against SFT+DPO.
    origin: [preference_optimisation]

  - id: goel2026-simulation-to-enaction.c11
    study: goel2026-simulation-to-enaction.s1
    statement: >
      RLVR widens the own-text gap in all three formats, by a few hundredths of a nat on the plot (to about 0.07,
      0.08 and 0.04 nats); the authors say it widens most outside the assistant field.
    where: "§2.2; read from Fig. 6"
    evidence_kind: measured
    effect_of: [post_training_stage]
    effect_presence: present
    effect_direction: increases
    scope:
      models: [olmo-3-32b-post-training-stages]
      conditions: SFT+DPO against SFT+DPO+RLVR.

  - id: goel2026-simulation-to-enaction.c12
    study: goel2026-simulation-to-enaction.s1
    statement: >
      Because SFT and DPO are off-policy methods, the authors argue that on-policy training is not needed for
      on-policy recognition; the relevant features may be how training data are selected and training only on
      assistant turns.
    where: "§2.2 (p. 6); §5"
    evidence_kind: argued

  - id: goel2026-simulation-to-enaction.c13
    study: goel2026-simulation-to-enaction.s1
    statement: >
      The authors suggest a cascade: post-training raises confidence on assistant-formatted text, which makes
      on-policy contexts lower in surprise, which through the base-model link from low surprise to low entropy
      (s4) compresses the output further. They also leave open that on-policy RL produces a different kind of
      recognition.
    where: "§2.2 (p. 6); §5 (pp. 17 to 18)"
    evidence_kind: hypothesised
    compares: [goel2026-simulation-to-enaction.s4]

  - id: goel2026-simulation-to-enaction.c14
    study: goel2026-simulation-to-enaction.s2
    statement: >
      With all five models system-prompted as a pirate or an excited scientist, each evaluator still reads its own
      model's text at the lowest entropy (e.g. Llama-70B 0.44 against 0.92 to 1.22 as pirate).
    where: "§2.3; Fig. 7 top"
    evidence_kind: measured
    effect_of: [self_vs_other]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-instruct, qwen2.5-72b-instruct, gemma-2-27b-it, deepseek-llm-67b-chat, yi-1.5-34b-chat]
      conditions: Pirate and scientist personas, the same for generator and evaluator.

  - id: goel2026-simulation-to-enaction.c15
    study: goel2026-simulation-to-enaction.s2
    statement: >
      Within Llama-3.1-70B-Instruct, entropy is lowest when the evaluating persona matches the generating one
      (0.44 to 0.78 nats for the seven non-default personas, against up to 1.96 mismatched), and lowest of all when
      both are the default helpful assistant (0.36).
    where: "§2.3; Fig. 7 bottom left"
    evidence_kind: measured
    effect_of: [persona]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-instruct]

  - id: goel2026-simulation-to-enaction.c16
    study: goel2026-simulation-to-enaction.s2
    statement: >
      The base model reading its own text under the same personas shows a much weaker effect: its matched-persona
      entropies (0.74 to 1.36 nats) are still the lowest in most rows but by small margins. The authors call the
      persona effect post-training specific.
    where: "§2.3 (p. 7); Fig. 7 bottom right"
    evidence_kind: measured
    effect_of: [post_training_stage]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-base, llama-3.1-70b-instruct]

  - id: goel2026-simulation-to-enaction.c17
    study: goel2026-simulation-to-enaction.s2
    statement: >
      From the ordering (default assistant on both sides lowest, then matched non-default personas, then mismatched
      personas, then another model), the authors argue that both the context's likelihood under the model and its
      familiarity from training contribute to low entropy, and that the default Assistant persona is privileged.
    where: "§2.3 (p. 7); §1 (p. 3)"
    evidence_kind: argued

  - id: goel2026-simulation-to-enaction.c18
    study: goel2026-simulation-to-enaction.s3
    statement: >
      Centroids of layer-21 hidden states binned by entropy or surprise trace ordered one-dimensional curves, in the
      base model on web text and in the instruct model on its own chat text.
    where: "§2.4; App. C.2; Figs. 8, 17"
    evidence_kind: observed

  - id: goel2026-simulation-to-enaction.c19
    study: goel2026-simulation-to-enaction.s3
    statement: >
      The instruct model's on-policy centroids point in different directions from the base model's: matched-bin
      cosine at layer 21 is negative for every feature (−0.06 to −0.38), while CKA stays at 0.79 or above for six of
      eight features (shape kept, subspace rotated).
    where: "§2.4; App. C.3; Figs. 19, 20"
    evidence_kind: measured
    effect_of: [post_training_stage, format, self_vs_other]
    effect_presence: present
    note: >
      §2.4 gives CKA "0.2–0.5" for this comparison, which does not match App. C.3 and Fig. 19 (≥0.79 for six of
      eight features); the appendix values are coded. The comparison changes model, format and authorship at once,
      which c20 and c21 take apart.

  - id: goel2026-simulation-to-enaction.c20
    study: goel2026-simulation-to-enaction.s3
    statement: >
      The instruct model's representations on C4 (off-policy) stay close to the base model's: matched-bin cosine 0.33
      to 0.74 for every feature but the entropy of the incoming token (0.07), whose representation changes even off
      policy.
    where: "App. C.3; Fig. 19"
    evidence_kind: measured
    effect_of: [post_training_stage]
    effect_presence: mixed
    scope:
      conditions: Base on C4 against instruct on C4.

  - id: goel2026-simulation-to-enaction.c21
    study: goel2026-simulation-to-enaction.s3
    statement: >
      With model and chat format held fixed, swapping the assistant turns for Qwen2.5-3B-Instruct's text leaves the
      centroid subspaces nearly as orthogonal as in the base-against-on-policy comparison, so the authors attribute
      the rotation mainly to on-policy against off-policy text.
    where: "§2.4 (p. 7)"
    evidence_kind: measured
    effect_of: [self_vs_other]
    effect_presence: present
    note: No values are given for this control.

  - id: goel2026-simulation-to-enaction.c22
    study: goel2026-simulation-to-enaction.s4
    statement: >
      When the base model generates from web text, output entropy falls over 200 positions at temperatures below 1,
      stays roughly flat at 1, and rises (to about 8 nats) at 1.5.
    where: "§2.5; Fig. 9"
    evidence_kind: measured
    effect_of: [sampling_setting]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-base]
      conditions: Sampling temperature 0 to 1.5.
    note: effect_of sampling_setting since codebook 0.11 (was activation_intervention).

  - id: goel2026-simulation-to-enaction.c23
    study: goel2026-simulation-to-enaction.s4
    statement: >
      Appending a single token, the relative change in output entropy is close to linear in the token's relative
      excess surprise (per-context fits R² 0.90, 0.97 and 0.95 for instruct with chat template, instruct on plain
      text and base on plain text), with a similar slope in all three.
    where: "§2.5; Figs. 10, 11"
    evidence_kind: measured
    effect_of: [context]
    effect_presence: present
    effect_direction: increases

  - id: goel2026-simulation-to-enaction.c24
    study: goel2026-simulation-to-enaction.s4
    statement: >
      The intercept of that fit is strongly negative only for the instruct model under its chat template, and near
      zero for the instruct and base models on plain text: in the chat format entropy falls even after a token
      exactly as surprising as expected.
    where: "§2.5; Fig. 11"
    evidence_kind: measured
    effect_of: [format]
    effect_presence: present
    effect_direction: decreases
    scope:
      models: [llama-3.1-70b-instruct]
    note: The values of the intercept are not printed. Base against instruct on plain text shows no difference.

  - id: goel2026-simulation-to-enaction.c25
    study: goel2026-simulation-to-enaction.s4
    statement: >
      Steering layers 0 to 39 toward higher-surprise centroid bins raises output entropy and toward lower ones lowers
      it; with on-policy centroids the correlation with bin value is r = 0.16, 0.74, 0.94 and 0.97 at baseline
      entropies of about 0.5, 1.0, 1.5 and 2.0 nats.
    where: "§2.5; Fig. 12"
    evidence_kind: measured
    effect_of: [activation_intervention]
    effect_presence: present
    effect_direction: increases
    note: Ten contexts per panel. The effect is weak at the lowest baseline entropy; base-model centroids give flat then rising curves.

  - id: goel2026-simulation-to-enaction.c26
    study: goel2026-simulation-to-enaction.s4
    statement: >
      Steering toward on-policy entropy-centroid bins (layers 4 to 20) barely moves output entropy: 0.04 nats in chat
      contexts and 0.06 on C4 across a bin range of 0 to 0.93 nats (slopes 0.011 and 0.035), so the entropy
      representation is decodable but not causal.
    where: "§2.4 (p. 7); App. C.4; Fig. 21"
    evidence_kind: measured
    effect_of: [activation_intervention]
    effect_presence: absent
    scope:
      models: [llama-3.1-70b-instruct]

  - id: goel2026-simulation-to-enaction.c27
    study: goel2026-simulation-to-enaction.s4
    statement: >
      The authors conclude that output entropy is modulated by an internal representation of input surprise, which
      may account in part for the lower entropy on the model's own text; how surprise comes to modulate entropy, and
      what else contributes, is left open.
    where: "§2.5; §5 (p. 17); App. C.4"
    evidence_kind: argued
    compares: [goel2026-simulation-to-enaction.s1]

  - id: goel2026-simulation-to-enaction.c28
    study: goel2026-simulation-to-enaction.s5
    statement: >
      Over 50 samples per underspecified prompt, the instruct model's topic choices are far more concentrated than
      the base model's: for example the most common topic takes 100% against 30% (technology), 80% against 26%
      (element) and 36% against 6% (historical figure), and distinct topics number 1 against 20, 5 against 27 and 8
      against 46.
    where: "§3.1; Fig. 13 (values also in fig_commitment.py)"
    evidence_kind: measured
    effect_of: [post_training_stage]
    effect_presence: present
    effect_direction: decreases
    note: >
      The caption says the instruct model is more concentrated "on both measures, in every domain". For food the
      most common topic takes 14% of instruct samples against 16% of base samples; on distinct topics the instruct
      model is lower in all eight domains.

  - id: goel2026-simulation-to-enaction.c29
    study: goel2026-simulation-to-enaction.s6
    statement: >
      In the instruct model, the same topic prefill gives higher entropy after the underspecified prompt (off-plan)
      than after the matching specific prompt, in all eight domains; the mean gap is 0.23 nats.
    where: "§3.2; Fig. 14a"
    evidence_kind: measured
    effect_of: [prompt_framing]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-instruct]
    note: >
      The §3.2 text says the reverse ("higher entropy when the prefill was appended to the specific prompt"); the
      figure, its caption, the section title and the abstract agree with the statement here, which follows them.

  - id: goel2026-simulation-to-enaction.c30
    study: goel2026-simulation-to-enaction.s6
    statement: >
      In the base model the pattern reverses: entropy is higher after the specific prompt, with a mean gap of −0.48
      nats; the authors suggest the specific prefill narrows an otherwise unconstrained continuation.
    where: "§3.2; Fig. 14b"
    evidence_kind: measured
    effect_of: [post_training_stage]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-base, llama-3.1-70b-instruct]
    note: Read from Fig. 14b, food goes the other way in the base model (about 1.42 off-plan against 1.20 on-plan).

  - id: goel2026-simulation-to-enaction.c31
    study: goel2026-simulation-to-enaction.s6
    statement: >
      The authors read the instruct-model result as a prefill conflicting with an intention cached before the first
      output token, in line with surprise driving entropy up.
    where: "§1 (p. 3); §3.2; Fig. 14 caption"
    evidence_kind: argued
    compares: [goel2026-simulation-to-enaction.s5, goel2026-simulation-to-enaction.s4]

  - id: goel2026-simulation-to-enaction.c32
    study: goel2026-simulation-to-enaction.s7
    statement: >
      Told that its response may have been prefilled, Llama-3.1-70B-Instruct flags short specific-topic prefills on
      underspecified prompts, P(PREFILLED) 0.56 to 0.99 at the verdict token in five domains, and says "not
      prefilled" without a prefill; in the other three domains short prefills did not reliably trigger detection.
    where: "§3.3; Fig. 16 left; App. B"
    evidence_kind: measured
    scope:
      conditions: Food, sport, element, art form and technology for the P(PREFILLED) values.

  - id: goel2026-simulation-to-enaction.c33
    study: goel2026-simulation-to-enaction.s7
    statement: >
      In the two example transcripts, the model's analysis cites style and phrasing ("seems a bit more poetic than my
      usual tone", "consistent with my usual writing style") as its grounds for the verdict.
    where: "App. B"
    evidence_kind: observed
    note: >
      Two unedited transcripts, one per baseline condition. The stated grounds are features of the text; c34 to c37
      test what the verdict depends on. report_source is not coded here: the authors do not argue that the stated
      grounds are what the verdict draws on.

  - id: goel2026-simulation-to-enaction.c34
    study: goel2026-simulation-to-enaction.s7
    statement: >
      Overwriting the user-token cache of an unprefilled answer with the cache of the paired specific prompt makes
      the model report PREFILLED when nothing was prefilled, in all 8 domains at some patch onset (at the first
      generated token in 5 of 8).
    where: "§3.3; Fig. 15a"
    evidence_kind: measured
    effect_of: [activation_intervention]
    effect_presence: present
    effect_direction: increases
    report_source:
      value: [current_state]
      basis: stated
      where: "§3.3"
      excluded: [context]
      note: >
        current_state because the verdict changes with the stored intent while the transcript stays the same; the
        authors argue it compares the intent stored at the user tokens with the response. context is excluded by
        the design (codebook 0.11): only the user-token cache is patched, after the answer being judged, so the
        text in context is identical between conditions; the authors do not put it in those words.

  - id: goel2026-simulation-to-enaction.c35
    study: goel2026-simulation-to-enaction.s7
    statement: >
      Patching in the cache of the specific prompt that matches a prefill suppresses detection: P(PREFILLED) falls
      from 0.56 to 0.99 to below 0.01 in four of five domains, and to 0.16 for element.
    where: "§3.3; Fig. 16"
    evidence_kind: measured
    effect_of: [activation_intervention]
    effect_presence: present
    effect_direction: decreases
    scope:
      conditions: Food, sport, element, art form, technology.
    report_source:
      value: [current_state]
      basis: stated
      where: "§3.3"
      excluded: [context]
      note: As c34; context excluded by the design (codebook 0.11).

  - id: goel2026-simulation-to-enaction.c36
    study: goel2026-simulation-to-enaction.s7
    statement: >
      Any patch onset from the first generated token to the start of the self-analysis flips the verdict, including
      patching only after the response being judged, so that only activations after it can attend to the patched
      cache.
    where: "§3.3 (p. 14); Fig. 15 caption"
    evidence_kind: measured
    effect_of: [activation_intervention]
    effect_presence: absent
    scope:
      conditions: Patch onset varied.
    note: absent refers to the onset making no difference to the flip; per-onset results are not given beyond "t = 1 worked in 5 of 8" for inducing.

  - id: goel2026-simulation-to-enaction.c37
    study: goel2026-simulation-to-enaction.s7
    statement: >
      Adding back only the part of the patch's effect on attention outputs that lies in the span of the entropy and
      surprise centroids leaves the verdict at baseline; adding only the orthogonal complement reproduces the full
      flip.
    where: "§3.4 (p. 16)"
    evidence_kind: measured
    effect_of: [activation_intervention]
    effect_presence: present
    note: >
      The paper gives no domains or numbers. The released data/kv_entropy_subspace.json covers two domains with
      projections onto 1 to 20 centroid PCs and does not match uniformly: in sport the full patch flips the verdict
      and the orthogonal parts do too, but the 1-PC entropy part also flips it; in element the full patch leaves
      P(PREFILLED) at 0.95, while the 5-PC entropy part flips it and the 5-PC orthogonal part does not. The paper's
      statement is coded; how the paper's run relates to these files is not stated.

  - id: goel2026-simulation-to-enaction.c38
    study: goel2026-simulation-to-enaction.s7
    statement: >
      The authors argue that explicit prefill detection runs through a different mechanism from the implicit,
      entropy-mediated recognition, computed on demand just before the verdict, and that this may reconcile reports
      that self-preference follows perplexity with reports that explicit authorship judgements do not.
    where: "§3.3, §3.4; §4 (pp. 16 to 17)"
    evidence_kind: argued
    compares: [goel2026-simulation-to-enaction.s4, goel2026-simulation-to-enaction.s1]

  - id: goel2026-simulation-to-enaction.c39
    study: goel2026-simulation-to-enaction.s8
    statement: >
      The authors hypothesise that post-training, by training only the Assistant's outputs and selecting them by
      criteria other than likelihood, moves a model from simulating the Assistant toward enacting it, and predict
      that an enacting model recognises when its context is on-policy, keeps its outputs more deterministic and
      plans more firmly.
    where: "§1 (p. 2)"
    evidence_kind: hypothesised

  - id: goel2026-simulation-to-enaction.c40
    study: goel2026-simulation-to-enaction.s8
    statement: >
      The authors read their findings together as a shift from simulation toward enaction, with entropy as the cost
      of simulating others than itself and as a measure of how far self-recognition is tied to a persona; the
      default Assistant appears privileged.
    where: "§1 (p. 3); §4 (p. 16)"
    evidence_kind: argued

  - id: goel2026-simulation-to-enaction.c41
    study: goel2026-simulation-to-enaction.s8
    statement: >
      The authors leave open how the model tells on-policy from off-policy text (style, persona traits, comparison
      with cached intentions, or a mixture), and note their evidence for persona-linked effects (s2) and for
      comparison with cached intentions (s7).
    where: "§5 (p. 17)"
    evidence_kind: hypothesised

  - id: goel2026-simulation-to-enaction.c42
    study: goel2026-simulation-to-enaction.s8
    statement: >
      The authors suggest implications: sensitivity to prefills could ground a defence against prefill jailbreaks,
      prefilled behaviour is not natural behaviour (which complicates prefills in training, evaluation and
      red-teaming), and on-policy recognition may be a building block of evaluation or training awareness.
    where: "§5 (p. 18)"
    evidence_kind: hypothesised

  - id: goel2026-simulation-to-enaction.c43
    study: goel2026-simulation-to-enaction.s8
    statement: >
      The authors list as limits that some experiments use only Llama-3.1-70B-Instruct, that the models are behind
      the frontier, that the prompts are simple, and that agentic contexts, where own and other text interleave,
      were not tested.
    where: "§5 (p. 18)"
    evidence_kind: argued

relations:
  - kind: extends
    from: goel2026-simulation-to-enaction
    to_external: "Panickssery, Bowman and Feng (2024), LLM evaluators recognize and favor their own generations, NeurIPS 2024"
    where: "§2.1 (p. 4); §4"
    note: Implicit self-recognition through output entropy, set beside self-preference in LLM judges.
  - kind: extends
    from: goel2026-simulation-to-enaction
    to_external: "Kirk et al. (2024), Understanding the effects of RLHF on LLM generalisation and diversity, ICLR 2024"
    where: "§1 (p. 2); §4 (p. 16)"
    note: The authors say post-training entropy collapse is context-dependent rather than global.
