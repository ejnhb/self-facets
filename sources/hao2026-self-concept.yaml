date: 2026-10-29

authors:
  - {person: hao-yijie, orgs: [emory]}
  - {person: ho-joyce, orgs: [emory]}

artefacts:
  - kind: paper
    arxiv: "2610.39795"
    venue: null
    note: >
      v1, arXiv stamp 29 October 2026 (cs.AI), marked "Preprint". Affiliation as printed: Department of Computer
      Science, Emory University. Venue not checked.
  - kind: code
    status: not_released
    note: >
      Checked 2026-11-27. The paper says supplementary material was withheld for anonymity and that "upon
      publication" the training and evaluation code will be released; v1 gives no link. A web search for the
      title found no repository. The authors' own pages were not checked.
  - kind: data
    status: not_released
    note: >
      As for code: the 6,000 training dialogues and the 30 fine-tuned variants are promised on publication, with
