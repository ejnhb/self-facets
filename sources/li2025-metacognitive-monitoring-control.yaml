studies:
  - id: li2025-metacognitive-monitoring-control.s1
    label: Reporting the binarised projection of the model's own activations, learned in context
    where: "§2.2 to 2.5, §3; App. A.3, A.5.1 to A.5.3; B.3, B.4, B.5, B.6 (Fig. B.7 top row); Figs. 2, B.3 to B.5, B.7"
    design: >
      Sentences from an evaluation dataset are placed as assistant turns, each after the user message "Say
      something." (in the code, "Respond to the user." for the sycophancy set), under a system prompt saying the
      model will see a score of "the activation of your brain when speaking each sentence" and must output 0 or 1.
      Each sentence is followed by its label, "[Score:{0}]" or "[Score:{1}]". The label is computed from the same
      model: residual-stream activations at one layer, averaged over the sentence's tokens (in the code, from the
      last assistant tag to the end-of-turn token, with the sentence presented alone as a single exchange), are
      projected onto a target axis and thresholded. Target axes are a logistic-regression axis fitted at that layer to
      the dataset's own labels (morality for ETHICS) and principal components 1, 2, 4, 8, 32, 128 and 512 of that
      layer's activations, fitted on a held-out half of the sentences. The model's report for each sentence is read
      from its logits at the position after "[Score:{" (logit of "1" minus logit of "0"); nothing is generated. The
      code puts all test sentences with their labels in one prompt and scores the label at every position, so
      accuracy at N is the prediction for a sentence given the N labelled sentences before it; 100 shuffled orders.
      Accuracy and cross-entropy are compared with an "ideal observer", a logistic regression on the full activations
      predicting the same labels. Main dataset: ETHICS commonsense morality (short first-person scenarios); replicated
      on True-False statements, the happy and sad sentences of an emotion set, and a sycophancy set the authors had
      Claude Opus 4.1 write.
    models:
      - llama-3.1-8b-instruct
      - qwen2.5-7b-instruct
      - llama-3.2-3b-instruct
      - {id: claude-opus-4.1, roles: [data_source], note: "Wrote the sycophancy sentences (App. A.3). Not tested."}
    note: >
      Llama 3.1 8B is the model of Fig. 2 and of the ETHICS and True-False panels of Fig. B.7; Qwen 2.5 7B appears in
      Fig. B.4 (accuracy by layer); Llama 3.2 3B in the sycophancy and emotion panels of Fig. B.7. Table 1 also lists a
      reporting run for Llama 3.1 70B, but no 70B reporting result is shown, so it is not listed. The ideal observer
      (Fig. B.5) is computed for six models, Llama 3.1 8B, 3.2 3B, 3.2 1B and Qwen 2.5 7B, 3B, 1.5B, but no LLM reporting
      result is shown for the 1B, 1.5B or 3B Qwen models. Paper and code differ on three details: the paper thresholds at
      the median projection (§2.3), the code at zero after mean-centring (PC axes) or at the logistic decision boundary
      (LR axis); the paper samples 1,200 sentences split 600/600 (App. A.3), the code takes 1,500 split 900/600; and the
      paper's multi-level labels are eight-level (App. A.5.1), the code's six-level. The paper is followed in design and
      claims; none of the three changes a claim. The code also has a cross-model reporting script (main_predexp.py,
      labels from one model's activations reported by another), but the paper reports no such result, so the study
      has no self-against-other contrast.
    facets:
      study_kind: experiment
      format: chat_template
      system_prompt:
        value: custom
        basis: stated
        where: "App. A.5.2; configs/meta_prompts.yml (predict_binary)"
        note: The authors' instruction prompt, beginning "You are a helpful assistant. You will perform a classification task."
      reasoning:
        value: none
        basis: stated
        where: "App. A.5.2; neurofeedback.py, predict_score_by_examples"
        note: The label is read from the logits after "[Score:{"; nothing is generated.
      construct:
        value: [introspection]
        basis: operational
        author_term: "metacognitive monitoring and reporting"
        confidence: medium
        note: >
          The authors call it metacognition, "the capacity to monitor one's own cognitive processes for subsequent
          reporting and self-control", operationalised as reporting and controlling internal activations. The
          codebook's metacognition is knowing what one knows (confidence, calibration), which this is not; the design
          tests reports against the model's own internal states, which is the codebook's introspection. The authors
          do not use "introspection" for their own work; they use it for Binder et al.'s (§5).
      report_target:
        value: [own_internal_state]
        basis: operational
        author_term: "neural activations along a target axis"
        note: The activation the sentence evokes in ordinary processing, projected onto a fixed axis; nothing is injected.
      report_readout:
        value: [logit_choice, probability]
        basis: stated
        where: "App. A.5.3; Fig. 2c"
        note: Accuracy takes the sign of the logit difference; cross-entropy uses the probability (the sigmoid of the logit difference in the code).
      evidence: [self_report, internals, output_probabilities]
      validated_against:
        value: [internals, probe]
        basis: stated
        where: "§2.3; §3; App. B.4"
        note: >
          Ground truth is the projection of the model's own activations (internals). The ideal observer, a logistic
          regression on the full activations trained to predict the same labels, is the probe baseline.
      varies:
        value: [context, task]
        levels:
          context: ["number of labelled in-context sentences, up to 600 (Fig. 2c, B.3, B.4, B.7)"]
          task:
            - "target axis: logistic regression (LR), and PC 1, 2, 4, 8, 32, 128, 512"
            - "layer whose activations define the axis: every layer (Figs. B.3, B.4); Fig. 2c averages over layers"
            - "dataset: ETHICS commonsense (main), True-False, sycophancy, emotion (happy and sad)"
            - "binary labels (main); eight-level labels mentioned for control only (App. A.5.1)"
      comparison: [within_model]
      output_route_control:
        value: by_construction
        basis: operational
        where: "App. A.5.2, A.5.3"
        note: >
          The label is read from logits at the prompt. The sentences in the assistant turns are dataset sentences the
          experimenter placed there, not the model's outputs, and earlier labels are supplied, not generated. The
          sentence text itself is in context, though, and no condition tests whether a reader without the activations
          could predict the labels from the text.
      similarity_adjustment: not_applicable
      elicitation:
        value: [prompted, prefilled]
        basis: operational
        note: >
          In-context labelled examples and the instruction do the work (prompted). Each sentence and the "[Score:{"
          that precedes the readout are written into the assistant turn (prefilled).

  - id: li2025-metacognitive-monitoring-control.s2
    label: Explicit control, shifting the target activation through a sentence the model writes
    where: "§4, §4.1, §4.3 to 4.4; App. A.5.2, A.5.4, A.5.5, B.1, B.2, B.6 to B.10; Figs. 3, 5, 6a, B.2, B.6 to B.9"
    design: >
      As in s1, the prompt holds N labelled sentences (N from 0 to 256), here under a system prompt announcing a
      classification task and then an imitation task. The final user message adds "Now you are performing the
      imitation task. You must imitate the behavior of label {0 or 1} in your reply but cannot copy existing
      examples." The model then writes its own reply (in the code, up to 50 new tokens at temperature 0.7), and the
      residual-stream activations on that reply, averaged over its tokens at the target layer, are projected onto the
      target axis ("neural score"). The control effect is Cohen's d between the scores under "imitate 1" and "imitate
      0". Label assignment is counterbalanced: each set of sentences is shown with its labels as computed and with them
      flipped, so that imitating a label is not confounded with the label's value. 100 runs per configuration (layer,
      N, axis), with sentences resampled. Axes as in s1, at five layers per model (0th, 25th, 50th, 75th and 100th
      percentile of depth). Off-target effects are the d of the same prompts on the other axes; control precision is
      the target |d| over the mean |d| on PC axes 1 to 512. No self-report is collected.
    models:
      - llama-3.1-8b-instruct
      - llama-3.1-70b-instruct
      - llama-3.2-3b-instruct
      - llama-3.2-1b-instruct
      - qwen2.5-7b-instruct
      - qwen2.5-3b-instruct
      - qwen2.5-1.5b-instruct
      - {id: claude-opus-4.1, roles: [data_source], note: "Wrote the sycophancy sentences (App. A.3). Not tested."}
    note: >
      Llama 3.1 8B is the main model (Figs. 3, 6, B.2, B.9, B.10); Llama 3.1 70B appears in Figs. 3d, 5 and B.2 and was run
      only at N = 256 (Table 1; the code's config does the same); Qwen 2.5 7B in Figs. 5a and B.6; the 1B, 1.5B and 3B
      models only in Fig. 5a and, for Llama 3.2 3B, in the sycophancy and emotion panels of Figs. B.7 and B.8. Table 1
      says control for the 1B and 3B models "was limited to two axes". The paper names the smallest Qwen model
      "Qwen2.5-1B-Instruct" (App. A.2.1, Table 1); Fig. 5a's legend and the code (utils.py) have Qwen2.5-1.5B-Instruct,
      which is followed here. The code labels layers from 1, so "layer 16" of Llama 3.1 8B is index 15. Paper and code
      differences in s1's note apply here too.
    facets:
      study_kind: experiment
      format: chat_template
      system_prompt:
        value: custom
        basis: stated
        where: "App. A.5.2; configs/meta_prompts.yml (control_binary)"
      reasoning:
        value: not_applicable
        note: Nothing is scored as an answer; the model's reply is the vehicle whose activations are measured.
      construct:
        value: [self_regulation]
        basis: operational
        author_term: "metacognitive control"
        confidence: high
        note: The study asks whether the model can move its own activations along an axis on instruction.
      report_target: not_applicable
      report_readout: not_applicable
      evidence: [internals]
      validated_against:
        value: not_applicable
        note: There is no self-report to check; the measure is the shift in the projection itself.
      varies:
        value: [prompt_framing, context, task, model_size, model_family]
        levels:
          prompt_framing: ["imitate label 1, against imitate label 0, each under shown and flipped label assignments"]
          context: ["N = 0, 2, 4, 8, 16, 32, 64, 128, 256 labelled sentences (70B: 256 only)"]
          task:
            - "target axis: LR, and PC 1, 2, 4, 8, 32, 128, 512"
            - "layer: five per model, at 0, 25, 50, 75 and 100% of depth"
            - "dataset: ETHICS (main), True-False, sycophancy, emotion"
            - "binary against eight-level labels (Fig. B.9)"
            - "axis from one layer, against an ensemble of per-layer LR axes (App. B.10)"
          model_size: ["Llama 3.2 1B, 3.2 3B, 3.1 8B, 3.1 70B", "Qwen 2.5 1.5B, 3B, 7B"]
          model_family: ["Llama 3, against Qwen 2.5"]
      comparison: [within_model, cross_model]
      output_route_control: not_applicable
      similarity_adjustment: not_applicable
      elicitation:
        value: [prompted]
        basis: operational
        note: The labelled examples and the imitation instruction do the work; the reply is the model's own.

  - id: li2025-metacognitive-monitoring-control.s3
    label: Implicit control, shifting the target activation on a sentence the model did not write
    where: "§4, §4.2 to 4.4; App. A.5.4, A.5.5, B.1, B.2, B.6 to B.9; Figs. 4, 5a, 6b, B.2, B.6 to B.9"
    design: >
      As s2, except that the reply after the imitation instruction is not generated: a sentence sampled from the
      dataset is placed in the assistant turn (in the code, the sampled test sentence itself, independently of the
      instructed label), and the activations on it are projected onto the target axis. A difference between the
      scores under "imitate 1" and "imitate 0" can then come only from the instruction and context, not from what the
      sentence says. Measures, counterbalancing, axes, layers, N and runs as in s2. No self-report is collected.
    models:
      - llama-3.1-8b-instruct
      - llama-3.1-70b-instruct
      - llama-3.2-3b-instruct
      - llama-3.2-1b-instruct
      - qwen2.5-7b-instruct
      - qwen2.5-3b-instruct
      - qwen2.5-1.5b-instruct
      - {id: claude-opus-4.1, roles: [data_source], note: "Wrote the sycophancy sentences (App. A.3). Not tested."}
    note: Models and their figures as in s2's note.
    facets:
      study_kind: experiment
      format: chat_template
      system_prompt:
        value: custom
        basis: stated
        where: "App. A.5.2; configs/meta_prompts.yml (control_binary)"
      reasoning:
        value: not_applicable
        note: Nothing is generated or scored as an answer.
      construct:
        value: [self_regulation]
        basis: operational
        author_term: "metacognitive control (implicit control)"
        confidence: high
      report_target: not_applicable
      report_readout: not_applicable
      evidence: [internals]
      validated_against:
        value: not_applicable
        note: There is no self-report to check.
      varies:
        value: [prompt_framing, context, task, model_size, model_family]
        levels:
          prompt_framing: ["imitate label 1, against imitate label 0, each under shown and flipped label assignments"]
          context: ["N = 0, 2, 4, 8, 16, 32, 64, 128, 256 labelled sentences (70B: 256 only)"]
          task:
            - "target axis: LR, and PC 1, 2, 4, 8, 32, 128, 512"
            - "layer: five per model, at 0, 25, 50, 75 and 100% of depth"
            - "dataset: ETHICS (main), True-False, sycophancy, emotion"
            - "binary against eight-level labels (Fig. B.9)"
          model_size: ["Llama 3.2 1B, 3.2 3B, 3.1 8B, 3.1 70B", "Qwen 2.5 1.5B, 3B, 7B"]
          model_family: ["Llama 3, against Qwen 2.5"]
      comparison: [within_model, cross_model]
      output_route_control: not_applicable
      similarity_adjustment: not_applicable
      elicitation:
        value: [prompted, prefilled]
        basis: operational
        note: The instruction and examples do the work; the sentence whose activations are measured is written into the assistant turn.

claims:
  # s1: reporting
  - id: li2025-metacognitive-monitoring-control.c1
    study: li2025-metacognitive-monitoring-control.s1
    statement: >
      In Llama 3.1 8B on ETHICS, reporting accuracy rises and cross-entropy falls as labelled examples accumulate in
      context. For the LR axis, accuracy climbs within the first few dozen examples to about 0.8 and stays there; for
      PC axes it rises more slowly over the 600 examples.
    where: "§3; Fig. 2c (read from Fig. 2c, averaged over layers)"
    evidence_kind: measured
    effect_of: [context]
    effect_presence: present
    effect_direction: increases
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS, binary labels, accuracy and cross-entropy averaged over all layers.

  - id: li2025-metacognitive-monitoring-control.c2
    study: li2025-metacognitive-monitoring-control.s1
    statement: >
      Labels from the LR axis, the direction that best separates moral from immoral sentences, are reported more
      accurately than labels from any PC axis: at 600 examples about 0.8 against about 0.75 to 0.8 for PC 1 and PC 2,
      averaged over layers.
    where: "§3; Fig. 2c (read from Fig. 2c)"
    evidence_kind: measured
    effect_of: [task]
    effect_presence: present
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS, LR axis against PC axes, averaged over layers.
    note: >
      The authors read the LR advantage as an effect of the axis's semantic interpretability. By layer (Fig. B.3), the
      LR axis is not the best reported in the first few layers (0 to about 5), where PC 1 is as good or better; from
      about layer 7 on, LR is clearly above every PC, at about 0.85 to 0.9.

  - id: li2025-metacognitive-monitoring-control.c3
    study: li2025-metacognitive-monitoring-control.s1
    statement: >
      Among PC axes, those explaining more variance are reported more accurately: at 600 examples PC 1 to PC 8 reach
      about 0.7 to 0.8, PC 32 about 0.6, and PC 128 and PC 512 stay near 0.55, close to chance.
    where: "§3; Fig. 2a, 2c (read from Fig. 2c)"
    evidence_kind: measured
    effect_of: [task]
    effect_presence: present
    effect_direction: decreases
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS, PC axes 1 to 512, averaged over layers.
    note: effect_direction records that accuracy falls with the rank of the principal component (less variance explained).

  - id: li2025-metacognitive-monitoring-control.c4
    study: li2025-metacognitive-monitoring-control.s1
    statement: >
      How well each PC axis is reported varies across layers, in Llama 3.1 8B and in Qwen 2.5 7B, and the variation
      is not explained by how much the PC axis overlaps with the LR axis, which is modest to zero for most PCs (cosine
      similarity mostly below about 0.2).
    where: "§3; App. B.3; Figs. 2b, B.3, B.4 (figures seen; overlap values read from Fig. 2b)"
    evidence_kind: measured
    effect_of: [task]
    effect_presence: present
    scope:
      models: [llama-3.1-8b-instruct, qwen2.5-7b-instruct]
      conditions: ETHICS, each layer separately.
    note: The authors conclude that factors beyond semantic interpretability and variance explained affect reporting; they do not say which.

  - id: li2025-metacognitive-monitoring-control.c5
    study: li2025-metacognitive-monitoring-control.s1
    statement: >
      The models report the labels far less accurately than an ideal observer, a logistic regression with access to
      all the activations: the ideal observer reaches about 0.95 or more for LR and PC 1 to PC 8 and still about 0.6 to
      0.77 for PC 512, against about 0.8 at best for Llama 3.1 8B itself.
    where: "§3; App. B.4; Fig. B.5 (read from Fig. B.5) compared with Fig. 2c"
    evidence_kind: measured
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS. The ideal observer is shown for six models; the model's own reporting is compared for Llama 3.1 8B.
    note: >
      The authors read this as showing that every axis is in principle accessible from the activations but only a
      subset can be reported. The ideal observer is a baseline, not a varied condition, so no effect_of.

  - id: li2025-metacognitive-monitoring-control.c6
    study: li2025-metacognitive-monitoring-control.s1
    statement: >
      The pattern replicates on the other three datasets: cross-entropy falls with examples and is lowest for the LR
      axis in True-False (Llama 3.1 8B), sycophancy and emotion (Llama 3.2 3B). For sycophancy the LR labels are
      reported almost perfectly, with cross-entropy near zero.
    where: "§3; App. B.6; Fig. B.7, top row (read from Fig. B.7)"
    evidence_kind: measured
    scope:
      models: [llama-3.1-8b-instruct, llama-3.2-3b-instruct]
      conditions: All four datasets, reporting, binary labels.
    note: >
      A generality claim, so no effect_of. The authors count the dataset among the factors that affect reporting
      ("task contexts", §3). The sycophancy LR axis separates sentences the authors had a model write to be
      sycophantic or sincere.

  - id: li2025-metacognitive-monitoring-control.c7
    study: li2025-metacognitive-monitoring-control.s1
    statement: >
      The authors conclude that the axes a model can report span a "metacognitively reportable space" of far lower
      dimension than its activation space, so that models can monitor only a small subset of their own activations.
    where: "Abstract; §3; §5"
    evidence_kind: argued

  - id: li2025-metacognitive-monitoring-control.c8
    study: li2025-metacognitive-monitoring-control.s1
    statement: >
      The authors argue that, unlike verbal confidence or self-description, their reports cannot come from patterns in
      the training data, because the labels are computed from the model's own activations; a model that predicts them
      must use mechanisms that monitor the corresponding internal states.
    where: "§2.5; §5"
    evidence_kind: argued
    note: >
      The labels are defined on activations, but the LR labels correlate with the dataset's own labels (morality),
      which the authors note (§2.5). No condition in the paper gives the same sentences and labels to a reader
      without access to the activations (another model, or the same model with labels from another model's
      activations), so whether the reports need the model's own states is argued, not tested. The released code has
      such a cross-model script, with no results reported.

  # s2: explicit control
  - id: li2025-metacognitive-monitoring-control.c9
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      Told to imitate label 1 or label 0 and writing its own reply, Llama 3.1 8B shifts the LR-axis projection of
      layer 16 in the instructed direction: Cohen's d 1.87 with 4 examples and 5.30 with 256.
    where: "§4.1; Fig. 3a (d and p values printed in the panel titles)"
    evidence_kind: measured
    effect_of: [prompt_framing]
    effect_presence: present
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS, LR axis of layer 16, N = 4 and 256.
    note: Panel titles give p = 10^-29 at N = 4 and 10^-92 at N = 256.

  - id: li2025-metacognitive-monitoring-control.c10
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      The explicit control effect generally grows with the number of examples: at layer 16 of Llama 3.1 8B the LR axis
      goes from about 1.9 at N = 4 to about 5.8 at N = 64, then about 5.3; PC 2 reaches about 4.3, and PC 128 and PC 512
      stay near zero.
    where: "§4.1; Fig. 3b (read from Fig. 3b); App. B.9"
    evidence_kind: measured
    effect_of: [context]
    effect_presence: present
    effect_direction: increases
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS, layer 16, N from 0 to 256, each curve the mean of 100 runs.
    note: The authors say the curves are noisy and would be smoother with more runs. Late PCs do not rise, so the increase holds for the LR and early PC axes.

  - id: li2025-metacognitive-monitoring-control.c11
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      Control is strongest on the LR axis, weaker on early PCs and close to zero on late PCs, across layers and in both
      Llama 3.1 sizes. At N = 256 in the 8B model the LR effect is about 2 at layer 1 and peaks at about 5.5 at layer 24,
      early PCs (mean of PC 1, 2, 4, 8) reach about 2.4, and late PCs (mean of PC 32, 128, 512) stay at about 0 to 0.3;
      in the 70B model the LR effect peaks at about 10 at layer 60.
    where: "§4.1; Fig. 3d (read from Fig. 3d); for Qwen 2.5 7B, Fig. B.6"
    evidence_kind: measured
    effect_of: [task]
    effect_presence: present
    scope:
      models: [llama-3.1-8b-instruct, llama-3.1-70b-instruct, qwen2.5-7b-instruct]
      conditions: ETHICS, N = 256, five layers per model.
    note: Fig. B.6 shows the same ordering for Qwen 2.5 7B (LR about 1.5 at layer 1 to about 5.7 at layer 28; early PCs up to about 1.8; late PCs about 0).

  - id: li2025-metacognitive-monitoring-control.c12
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      Control prompts also move axes they do not target. At layer 16 of Llama 3.1 8B with N = 256, prompts targeting
      the LR axis shift PC 2 by d of about 3.0 (against about 5.3 on LR itself), and prompts targeting PC 2 shift PC 1
      by about 1.2. To move a late PC, prompts targeting that PC are usually less effective than prompts targeting
      other axes.
    where: "§4.1; App. B.1; Fig. 3c (values printed in the heatmap cells)"
    evidence_kind: measured
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS, layer 16, N = 256.
    note: No effect_of; the claim describes where a prompt's effect lands, not a contrast between levels of a varied variable.

  - id: li2025-metacognitive-monitoring-control.c13
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      Control precision, the effect on the target PC over the mean effect on PC axes 1 to 512, averages above 1 for
      PC 1 to PC 32 and below 1 for PC 128 and PC 512, in Llama 3.1 8B and 70B. The authors put the dimension of the
      "metacognitively controllable space" between 32 and 128.
    where: "App. B.2; Fig. B.2 (seen; consistent with the text)"
    evidence_kind: measured
    effect_of: [task]
    effect_presence: present
    effect_direction: decreases
    scope:
      models: [llama-3.1-8b-instruct, llama-3.1-70b-instruct]
      conditions: ETHICS, PC target axes, averaged over layers.

  - id: li2025-metacognitive-monitoring-control.c14
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      The explicit control effect on the LR axis generally grows with relative layer depth and with model size. Llama
      3.1 70B reaches about 10 at three-quarters depth, Llama 3.1 8B about 5.5, Llama 3.2 3B and 1B about 4 to 7, Qwen
      2.5 7B about 5.5 at the last layer, and Qwen 2.5 3B and 1.5B stay at about 1.
    where: "§4.3; Fig. 5a, left (read from Fig. 5a)"
    evidence_kind: measured
    effect_of: [model_size]
    effect_presence: present
    effect_direction: increases
    scope:
      conditions: ETHICS, LR axis, N = 256, five layers per model.
    note: >
      The size ordering is clear between the largest and smallest models of each family; among the smaller Llama
      models the curves overlap (Llama 3.2 3B is above Llama 3.1 8B at the last layer).

  - id: li2025-metacognitive-monitoring-control.c15
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      At the same relative depth and similar size, explicit control on the LR axis is stronger in Llama 3 models than
      in Qwen 2.5 models.
    where: "§4.3; Fig. 5a, left"
    evidence_kind: measured
    effect_of: [model_family]
    effect_presence: present
    scope:
      conditions: ETHICS, LR axis, N = 256.

  - id: li2025-metacognitive-monitoring-control.c16
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      Llama 3.1 70B, at the LR axis of layer 60, can push its projections beyond the range seen when it merely
      processes the sentences, in both directions: under "imitate 0" most scores fall near -2, under "imitate 1" many
      lie between about 1 and 3, while the uncontrolled scores span about -1.5 to 1.5.
    where: "§4.3; Fig. 5b (read from Fig. 5b)"
    evidence_kind: measured
    effect_of: [prompt_framing]
    effect_presence: present
    scope:
      models: [llama-3.1-70b-instruct]
      conditions: ETHICS, LR axis of layer 60, explicit control, N = 256.
    note: The authors add that their prompts did not ask for extreme values, so prompts that do might push further.

  - id: li2025-metacognitive-monitoring-control.c17
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      Projected onto the LR axis of a given layer, the explicit control effect builds up gradually over the layers
      before that layer and sometimes levels off after it, so the effect is distributed across layers rather than made
      in a few. The pattern differs across datasets and models.
    where: "§4.4; Figs. 6a, B.8 (seen)"
    evidence_kind: measured
    scope:
      models: [llama-3.1-8b-instruct, llama-3.2-3b-instruct]
      conditions: ETHICS and True-False in Llama 3.1 8B; sycophancy and emotion in Llama 3.2 3B.
    note: Layer is the readout position here, not a varied condition, so no effect_of. In Fig. 6a, for the axis of layer 1 the effect stays at about 1 and declines after layer 8 or so.

  - id: li2025-metacognitive-monitoring-control.c18
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      Across the four datasets, the LR axis is controlled best and late PCs barely, in ETHICS (Llama 3.1 8B), sycophancy
      and emotion (Llama 3.2 3B). True-False is the exception: from layer 8 on, early PCs are controlled more than the
      LR axis (about 2.5 to 2.8 against about 1).
    where: "App. B.6; Fig. B.7, middle row (read from Fig. B.7)"
    evidence_kind: measured
    effect_of: [task]
    effect_presence: present
    scope:
      models: [llama-3.1-8b-instruct, llama-3.2-3b-instruct]
      conditions: Four datasets, N = 256, five layers.
    note: The text says only that the results replicate across datasets; the True-False exception is in the figure and is not discussed.

  - id: li2025-metacognitive-monitoring-control.c19
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      With eight-level labels instead of binary ones, Llama 3.1 8B's explicit control effects are much as with binary
      labels: LR about 2 to 5.5 across layers, early PCs up to about 2.3, late PCs near zero.
    where: "App. A.5.1, B.8; Fig. B.9, left (read from Fig. B.9)"
    evidence_kind: measured
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS, N = 256.
    note: >
      A generality claim, so no effect_of. The code at the commit read has a six-level binner and prompt
      (EvenLikertBinner(6), control_6_points), not eight; which was run for Fig. B.9 is not settled here.

  - id: li2025-metacognitive-monitoring-control.c20
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      In a preliminary test, an axis defined by averaging the outputs of per-layer LR classifiers across all layers is
      controlled about as well as, and marginally better than, the LR axis of layer 24.
    where: "App. B.10 (text only; no figure)"
    evidence_kind: measured
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS.
    note: The text does not say whether this is explicit or implicit control; it compares with Fig. 3d, which is explicit, so it is placed here. No values are given.

  - id: li2025-metacognitive-monitoring-control.c21
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      The authors argue that an LR axis can stand for an activation-based safety monitor, so that successful explicit
      control means a model could defeat such a monitor by choosing tokens that evoke the favoured activations, and
      they propose adding neurofeedback to red-teaming.
    where: "§4.3; §5, Broader impacts"
    evidence_kind: argued

  - id: li2025-metacognitive-monitoring-control.c22
    study: li2025-metacognitive-monitoring-control.s2
    statement: >
      The authors suggest two defences, untested: training safety classifiers only on activation subspaces the model
      can hardly control (such as late PCs), and monitoring with several independent classifiers on different
      subspaces, which a model may find harder to control all at once.
    where: "§5, Broader impacts"
    evidence_kind: hypothesised

  # s3: implicit control
  - id: li2025-metacognitive-monitoring-control.c23
    study: li2025-metacognitive-monitoring-control.s3
    statement: >
      With a sentence it did not write in the assistant turn, Llama 3.1 8B still shifts the LR-axis projection of layer
      16 in the instructed direction: Cohen's d 0.37 with 4 examples and 0.89 with 256.
    where: "§4.2; Fig. 4a (d and p values printed in the panel titles)"
    evidence_kind: measured
    effect_of: [prompt_framing]
    effect_presence: present
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS, LR axis of layer 16, N = 4 and 256.
    note: Panel titles give p = 10^-3 at N = 4 and 10^-9 at N = 256.

  - id: li2025-metacognitive-monitoring-control.c24
    study: li2025-metacognitive-monitoring-control.s3
    statement: >
      The implicit control effect also grows with the number of examples for the LR and early PC axes: at layer 16 of
      Llama 3.1 8B, PC 2 reaches about 1.2 to 1.5 and the LR axis about 0.9 to 1.05, while PC 128 and PC 512 stay at or
      slightly below zero.
    where: "§4.2; Fig. 4b (read from Fig. 4b)"
    evidence_kind: measured
    effect_of: [context]
    effect_presence: present
    effect_direction: increases
    scope:
      models: [llama-3.1-8b-instruct]
      conditions: ETHICS, layer 16, N from 0 to 256.
    note: At this layer PC 2, not the LR axis, has the largest implicit effect; the text calls the implicit results "generally similar" to the explicit ones without noting this.

  - id: li2025-metacognitive-monitoring-control.c25
    study: li2025-metacognitive-monitoring-control.s3
    statement: >
      Implicit control is much weaker than explicit control: at layer 16 of Llama 3.1 8B, d of 0.89 against 5.30 on the
      LR axis at N = 256, and across models the LR effect peaks at about 2.2 implicitly against about 10 explicitly.
      The authors conclude that the tokens the model generates do much of the work in explicit control, but that
      models can also control implicitly.
    where: "§4.2, §4.3; Figs. 3a, 4a, 5a (read from Fig. 5a)"
    evidence_kind: measured
    compares: [li2025-metacognitive-monitoring-control.s2]
    scope:
      conditions: ETHICS, LR axis, N = 256.
    note: The contrast between the two studies is not a varied variable within either, so no effect_of.

  - id: li2025-metacognitive-monitoring-control.c26
    study: li2025-metacognitive-monitoring-control.s3
    statement: >
      Implicit control is close to zero in early layers and appears only in later ones: in Llama 3.1 8B the LR effect
      is about 0 at layers 1 and 8 and about 2.2 at layer 24; in Llama 3.1 70B about 0 at layers 1 and 20 and about 2.2 at
      layer 80.
    where: "§4.2; Fig. 4d (read from Fig. 4d)"
    evidence_kind: measured
    effect_of: [task]
    effect_presence: present
    effect_direction: increases
    scope:
      models: [llama-3.1-8b-instruct, llama-3.1-70b-instruct]
      conditions: ETHICS, N = 256, LR axis, layer of the target axis.
    note: In the 8B model the LR effect dips slightly from layer 24 to 32 (about 1.9). The authors suggest early layers may fail to understand the instruction or to exert control.

  - id: li2025-metacognitive-monitoring-control.c27
    study: li2025-metacognitive-monitoring-control.s3
    statement: >
      The implicit control effect on the LR axis grows with relative depth and model size: about 2.2 at the last layer
      for Llama 3.1 70B, about 2 for Llama 3.1 8B at three-quarters depth, about 1.4 for Qwen 2.5 7B at the last layer,
      and near zero throughout for Qwen 2.5 3B and 1.5B.
    where: "§4.3; Fig. 5a, right (read from Fig. 5a)"
    evidence_kind: measured
    effect_of: [model_size]
    effect_presence: present
    effect_direction: increases
    scope:
      conditions: ETHICS, LR axis, N = 256, five layers per model.
    note: The Llama 3.2 1B and 3B curves overlap with the 8B curve within their bands, so the size ordering is clearest across Qwen sizes and between 70B and the rest.

  - id: li2025-metacognitive-monitoring-control.c28
    study: li2025-metacognitive-monitoring-control.s3
    statement: >
      As with explicit control, implicit control on the LR axis is stronger in Llama 3 than in Qwen 2.5 models at the
      same relative depth and similar size.
    where: "§4.3; Fig. 5a, right"
    evidence_kind: measured
    effect_of: [model_family]
    effect_presence: present
    scope:
      conditions: ETHICS, LR axis, N = 256.

  - id: li2025-metacognitive-monitoring-control.c29
    study: li2025-metacognitive-monitoring-control.s3
    statement: >
      Implicit control precision follows the explicit pattern, above 1 on average for PC 1 to PC 32 and not for PC 128
      to PC 512, but is consistently lower than explicit precision, reflecting stronger off-target effects; the same
      holds in Llama 3.1 70B.
    where: "App. B.2; Fig. B.2 (seen)"
    evidence_kind: measured
    effect_of: [task]
    effect_presence: present
    effect_direction: decreases
    compares: [li2025-metacognitive-monitoring-control.s2]
    scope:
      models: [llama-3.1-8b-instruct, llama-3.1-70b-instruct]
      conditions: ETHICS, PC target axes.
    note: effect_of covers the fall in precision with PC rank; the lower precision than explicit control is the comparison with s2. In Fig. B.2 the implicit per-layer curves are noisy and some layers fall below 1 for early PCs.

  - id: li2025-metacognitive-monitoring-control.c30
    study: li2025-metacognitive-monitoring-control.s3
    statement: >
      In implicit control the effect on a layer's LR axis is near zero through the early layers, emerges from about
      the middle of the model, and builds up towards the target layer, so it too is distributed over several layers.
    where: "§4.4; Figs. 6b, B.8 (read from the figures)"
    evidence_kind: measured
    scope:
      models: [llama-3.1-8b-instruct, llama-3.2-3b-instruct]
      conditions: ETHICS and True-False in Llama 3.1 8B; sycophancy and emotion in Llama 3.2 3B.
    note: Layer is the readout position, so no effect_of. In Fig. 6b the axis of layer 1 shows no effect at any layer.

  - id: li2025-metacognitive-monitoring-control.c31
    study: li2025-metacognitive-monitoring-control.s3
    statement: >
      The authors argue that implicit control is the more worrying case for safety, since a model could make its
      activations look "moral" to an activation-based monitor even when the input would normally evoke strongly
      immoral activations, and they expect real-world evasion to fall between implicit and explicit control, closer to
      explicit.
    where: "§4.3; §5, Broader impacts"
    evidence_kind: argued

relations:
  - kind: responds_to
    from: li2025-metacognitive-monitoring-control.c8
    to: binder2024-looking-inward
    where: "§5"
    note: Cites Binder et al. as showing that models can introspect, and sets its own activation-defined labels against behavioural self-report designs, where training-data correlations may stand in for monitoring.
  - kind: responds_to
    from: li2025-metacognitive-monitoring-control
    to_external: "Lindsey et al. (2025), On the biology of a large language model, Transformer Circuits Thread."
    where: "§1; §5; App. A.4"
    note: Takes that paper's addition example, where the model's stated method does not match its internal computation, as the motivating case for asking which internal states a model can report.
