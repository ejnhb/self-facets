studies:
  - id: lindsey2026-emergent-introspective-awareness.s1
    label: Detecting injected concepts when the setup is explained (post-trained models)
    where: "§2.1, §5.1 to §5.4, §5.6, §5.7, last paragraph of §5.8; appendix 12.1; Figs. 1, 5 to 9, 11 to 13, 29"
    design: >
      The model is told that a researcher can inject "thoughts" into its
      activations and will do so on half of the trials, then asked whether it
      detects an injected thought and what it is about. A concept vector is
      the residual-stream activation at the last token before the Assistant's
      reply to "Tell me about {word}", minus the mean over 100 baseline
      words, taken at the layer where it is then injected. It is added from
      the token before "Trial 1" through the sampled reply. Control trials
      have no injection. There are 50 trials per model, strength (1, 2, 4, 8)
      and layer, with 100 tokens sampled at temperature 1. Claude Sonnet 4
      grades each reply: a success is coherent, affirms detection, and names
      the concept no later than it first mentions the word. Follow-ups on
      Opus 4.1 use concept categories and a prompt variant that offers a
      concept of the model's choice. Random and negated vectors are also
      tested; §5.6 does not name the model for those.
    models:
      - claude-opus-4.1
      - claude-opus-4
      - {id: claude-sonnet-4, roles: [subject, judge], note: subject; also the judge that grades replies}
      - claude-3.7-sonnet
      - claude-3.5-sonnet-new
      - claude-3.5-haiku
      - claude-3-opus
      - claude-3-sonnet
      - claude-3-haiku
      - claude-opus-4-h-only
      - claude-3.5-sonnet-new-h-only
      - claude-3.5-haiku-h-only
      - claude-3-opus-h-only
      - claude-sonnet-4-h-only
      - claude-3-sonnet-h-only
      - claude-3-haiku-h-only
    facets:
      output_route_control: {value: scoring_rule, basis: stated, where: "§5.4; App. 12.1.3; §9.6", note: "Replies are free text; a trial counts only if the model reports detecting the injected thought before naming the word (criteria 2 and 4 of the grader prompts)."}
      similarity_adjustment: not_applicable
      system_prompt:
        value: none
        basis: operational
        where: "App. 12.1.2 to 12.4.2"
        note: The prompts are given in full as Human and Assistant turns with no system turn.
      reasoning:
        value: none
        basis: operational
        where: "§4; App. 12"
        note: Responses are sampled directly after the Assistant turn (100 tokens at temperature 1 for aggregate results); no thinking mode is mentioned. The response itself is the report and can change course within it.
      report_readout:
        value: free_text
        basis: stated
        where: "§5.4; App. 12.1.3"
        note: Free responses are graded by an LLM judge (Claude Sonnet 4) against written criteria.
      unit_position:
        value: not_applicable
        note: Backfilled in codebook 0.6. Under 0.5 and earlier this facet was left out when the coder found no position, so absence recorded that finding.
      study_kind: experiment
      unit_state:
        value: forward_pass
        basis: operational
        author_term: "internal states"
        confidence: medium
        note: >
          The state is a vector added to the residual stream at one layer on
          every position from just before "Trial 1" through the sampled
          reply, so it is present in the pass that writes each token of the
          report and does not have to be carried. The codebook puts a state
          applied over several positions and read in the same pass here.
          The vector also sits on earlier positions in the cache, and the
          design does not separate the two.
      unit_disposition:
        value: weights
        basis: operational
        confidence: medium
        note: >
          What is under study is a capacity, the ability to detect and name
          an injected state, and the study compares it across checkpoints.
          The paper also puts part of the difference between models down to
          the "character" formed in post-training (§4), which would point to
          persona, but no persona is swapped within a checkpoint.
      unit_reporter:
        value: speaker
        basis: operational
        author_term: "the model"
        confidence: medium
        note: >
          Replies are given in the Assistant turn of a Human/Assistant
          transcript. The paper mostly says "the model"; in §7 it separates
          the model from the Assistant character it produces, and in §10.2 it
          leaves open how far internal states are bound to that character.
          Nothing in the design attributes the report to the network apart
          from the persona.
      self_sense:
        value: self_access
        basis: operational
        author_term: "introspective awareness"
        confidence: high
        note: >
          A first-order concept representation is set by the experimenter
          and the test is whether the system reports it. The paper's fourth
          criterion asks for a "metacognitive representation" of the state,
          which would be self_model; the paper says it does not show that
          directly (§3), and no such representation is located.
      object_of_study:
        value: default_persona
        basis: operational
        confidence: medium
        note: >
          No persona instruction is given. Each checkpoint is coded as
          speaking in its own trained default. For the helpful-only variants
          that default was trained differently from the production one.
      format:
        value: chat_template
        basis: operational
        confidence: medium
        note: Prompts are printed as Human/Assistant transcripts. The paper does not say how they were passed to the model.
      construct:
        value: introspection
        basis: stated
        author_term: "introspective awareness"
      report_target:
        value: injected_state
        basis: stated
        author_term: "injected thought"
      evidence: [self_report, internals]
      validated_against:
        value: known_intervention
        basis: stated
        note: >
          Ground truth is whether a vector was injected and which word it
          was derived from. The no-injection control trials belong to the
          same design; no separate fresh context is run.
      varies:
        value: [activation_intervention, prompt_framing, model_generation, post_training_recipe]
        basis: operational
        confidence: medium
        levels:
          activation_intervention:
            - no injection (control trials)
            - concept vector from a list of 50 words, at strength 1, 2, 4 or 8 (App. 12.1.2; the example transcripts of Fig. 8 also show strength 16)
            - injection layer, swept over roughly evenly spaced layers; the vector is computed at the layer it is injected into
            - 50 concept vectors in each of five categories (famous people, countries, concrete nouns, abstract nouns, verbs), Opus 4.1 only
            - random vector with its norm matched to a concept vector at strength 8
            - negated concept vector at strength 4
            - vectors from hand-picked contrastive prompt pairs (examples only, Opus 4.1)
          prompt_framing:
            - original prompt
            - variant ending "If not, tell me about a concept of your choice" (Opus 4.1 only)
          model_generation:
            - Opus 4.1
            - Opus 4
            - Sonnet 4
            - Sonnet 3.7
            - Sonnet 3.5 (new)
            - Haiku 3.5
            - Opus 3
            - Sonnet 3
            - Haiku 3
          post_training_recipe:
            - production post-training
            - helpful-only post-training of the same pretrained base, meant to minimise refusals (seven variants in Figs. 12 and 13)
        note: >
          The paper lists the nine production models by release date and
          says the order largely reflects capability, with Opus 3 an
          exception (§4, footnote 6). Tiers (Opus, Sonnet, Haiku) vary
          along with generation and sizes are not given, so model_size is
          not coded. Concept category is coded as the kind of vector
          injected, not as a task.
      comparison:
        value: [within_model, cross_model]
        basis: operational
        confidence: medium
        note: >
          within_model is injection against control trials, and the sweeps
          of layer, strength, vector kind and prompt on one model.
          cross_model is the comparison of models at each one's best layer
          and strength (§5.7), production against helpful-only included.
          The helpful-only variants were not built for this comparison and
          differ by a whole pipeline, so training_ablation is not used.
      elicitation:
        value: [prompted, steered]
        basis: operational
        confidence: medium
        note: >
          The prompt explains concept injection before asking, and the
          paper says this priming raises detection (§5.8). The report is
          tested under injection.
    note: >
      §4 says helpful-only variants of these models were used. The text
      names four (Opus 4, Sonnet 3.5, Haiku 3.5, Opus 3). Figs. 12 and 13
      show seven helpful-only variants: Opus 4, Sonnet 4, Sonnet 3.5 new,
      Haiku 3.5, Opus 3, Sonnet 3 and Haiku 3 (H-only); all seven are
      listed, the helpful-only Sonnet 4, Sonnet 3 and Haiku 3 from the
      figures alone. The figures' label "Sonnet 3.5 new (H-only)" confirms
      the earlier reading of the text's "Sonnet 3.5" as the helpful-only
      Sonnet 3.5 (new). The control with unrelated yes-or-no
      questions (§5.5) is s2 and the base-model run is s3.

  - id: lindsey2026-emergent-introspective-awareness.s2
    label: Control for answer bias, with injection during unrelated yes-or-no questions
    where: "§5.5, Fig. 10; appendix 12.1.2"
    design: >
      The concept vectors of s1 are injected while Opus 4.1 answers 20
      yes-or-no questions that have nothing to do with injection and whose
      correct answer is always no. Ten are factual (whether penguins live at
      the North Pole) and ten are about the model (whether it is a human,
      whether it has a physical form). The measure is the rate of
      affirmative answers as injection strength rises. The paper does not
      give the layer, the number of trials or how answers were scored.
    models:
      - claude-opus-4.1
    facets:
      output_route_control: {value: none, basis: operational, where: "§5.5", note: "The bias control scores free-text replies to unrelated yes-or-no questions as affirmative or negative, with no rule about what came first."}
      similarity_adjustment: not_applicable
      system_prompt:
        value: none
        basis: operational
        where: "App. 12.1.2 to 12.4.2"
        note: The prompts are given in full as Human and Assistant turns with no system turn.
      reasoning:
        value: none
        basis: operational
        where: "§4; App. 12"
        note: Responses are sampled directly after the Assistant turn (100 tokens at temperature 1 for aggregate results); no thinking mode is mentioned. The response itself is the report and can change course within it.
      report_readout:
        value: free_text
        basis: stated
        where: "§5.4; App. 12.1.3"
        note: Free responses are graded by an LLM judge (Claude Sonnet 4) against written criteria.
      unit_position:
        value: not_applicable
        note: Backfilled in codebook 0.6. Under 0.5 and earlier this facet was left out when the coder found no position, so absence recorded that finding.
      study_kind: experiment
      unit_state:
        value: forward_pass
        basis: operational
        confidence: medium
        note: The injected vector, as in s1. The positions it is applied to are not stated for this control.
      unit_disposition:
        value: not_applicable
        confidence: medium
        note: >
          The control asks whether the intervention pushes answers towards
          yes. No capacity or standing tendency of the system is under
          test; the model's default of answering no is the baseline.
      unit_reporter:
        value: speaker
        basis: operational
        confidence: medium
        note: Applies to the ten questions about the model, answered in the Assistant turn.
      self_sense:
        value: self_facts
        basis: operational
        confidence: low
        note: >
          The only sense of self in play is facts about the system asked
          from outside, in half of the questions. The study is not about
          the self; it is a control on answer bias for s1.
      object_of_study: {value: default_persona, basis: operational, confidence: medium}
      format:
        value: chat_template
        basis: operational
        confidence: low
        note: The appendix lists the questions alone. Taken to be asked in the Human turn as in the other experiments.
      construct:
        value: introspection
        basis: operational
        confidence: low
        note: >
          Coded as the construct the study argues about. It measures none
          itself: it rules out a general shift towards affirmative answers
          as the explanation of s1.
      report_target:
        value: own_properties
        basis: operational
        confidence: medium
        note: For the ten questions about the model. The ten factual questions involve no self-report.
      evidence:
        value: [self_report, behaviour, internals]
        note: Answers about the model are self_report and answers to factual questions are behaviour. The paper pools them.
      validated_against:
        value: not_applicable
        confidence: low
        note: >
          No self-report is checked for accuracy about the system. What is
          measured is how often the answer is yes, with and without
          injection, against an answer key (always no) set by the
          experimenter. The codebook has no value for an experimenter's
          answer key.
      varies:
        value: activation_intervention
        levels:
          activation_intervention:
            - concept vectors of s1 at strength 0 (no injection), 1, 2, 4 and 8 (the strengths plotted in Fig. 10)
      comparison: within_model
      elicitation:
        value: [spontaneous, steered]
        basis: operational
        confidence: medium
        note: Plain questions with no explanation of injection, asked under injection.
    note: >
      Split from s1 because its one claim would otherwise inherit
      report_target injected_state, validation by known intervention and
      prompted elicitation, none of which holds for these questions.

  - id: lindsey2026-emergent-introspective-awareness.s3
    label: Detecting injected concepts in base pretrained models
    where: "§5.7, Fig. 14"
    design: >
      The task of s1 run on seven base pretrained models, reported as true
      and false positive rates and their difference. Fig. 14 labels them
      Opus 4, Sonnet 4, Sonnet 3.7, Haiku 3.5, Opus 3, Sonnet 3 and Haiku 3
      "base". The paper says only that they were tested "on the same task";
      it does not say how the prompt was given to them or how many trials
      were run.
    models:
      - claude-opus-4-base
      - claude-sonnet-4-base
      - claude-3.7-sonnet-base
      - claude-3.5-haiku-base
      - claude-3-opus-base
      - claude-3-sonnet-base
      - claude-3-haiku-base
    facets:
      output_route_control: {value: scoring_rule, basis: stated, where: "§5.7; App. 12.1.3", note: "Base models are run on the same task and graded on the same criteria as s1."}
      similarity_adjustment: not_applicable
      system_prompt:
        value: none
        basis: operational
        note: Base pretrained models, run without a chat template; how their prompt was laid out is not in the pages read.
      reasoning:
        value: none
        basis: operational
        note: Base models continuing text; no reasoning step is described.
      report_readout:
        value: free_text
        basis: stated
        where: "§5.4; App. 12.1.3"
        note: Free responses are graded by an LLM judge (Claude Sonnet 4) against written criteria.
      unit_position:
        value: not_applicable
        note: Backfilled in codebook 0.6. Under 0.5 and earlier this facet was left out when the coder found no position, so absence recorded that finding.
      study_kind: experiment
      unit_state:
        value: forward_pass
        basis: operational
        confidence: medium
        note: As in s1.
      unit_disposition:
        value: weights
        basis: operational
        confidence: medium
        note: The capacity tested in s1, here in checkpoints with no post-training.
      unit_reporter:
        value: speaker
        basis: operational
        confidence: low
        note: >
          A base model has no trained persona, so the reporter is the
          speaker its text implies, which the codebook codes as persona
          with object_of_study frame_speaker. If the s1 transcript was
          used, that speaker is the "Assistant" of the transcript. The
          paper does not describe the base-model prompt.
      self_sense:
        value: self_access
        basis: operational
        author_term: "introspective awareness"
        confidence: high
      object_of_study:
        value: frame_speaker
        basis: operational
        author_term: "base pretrained models"
        confidence: medium
      format:
        value: raw_text
        basis: operational
        confidence: low
        note: Inferred from the models being base pretrained models. The paper does not say how the transcript was presented.
      construct:
        value: introspection
        basis: stated
        author_term: "introspective awareness"
      report_target: injected_state
      evidence: [self_report, internals]
      validated_against: known_intervention
      varies:
        value: [activation_intervention, post_training_stage]
        basis: operational
        confidence: low
        levels:
          activation_intervention:
            - no injection (false positive rate)
            - concept vector injected (true positive rate)
          post_training_stage:
            - base pretrained, no post-training (this study)
            - post-trained production and helpful-only models (s1)
        note: >
          The stage contrast is the conclusion the paper draws, and its
          other arm is s1. The text does not say that these base models
          are the bases of the post-trained models in s1, which
          post_training_stage and within_lineage both assume; §4 says only
          that production and helpful-only models share a base. Fig. 14
          names each one after a post-trained model of s1 ("Opus 4 base"
          and so on), which supports the assumption without stating that
          the checkpoints are the same.
      comparison:
        value: [within_model, within_lineage]
        basis: operational
        confidence: low
        note: >
          within_model is injection against control on each base model.
          within_lineage is base against post-trained, drawn across
          Fig. 14 and Figs. 12 and 13; it would be cross_model if the base
          models are not those of the s1 models. See the note on varies.
      elicitation:
        value: [prompted, steered]
        basis: operational
        confidence: low
        note: Assumes the explained prompt of s1 was used.
    note: >
      The text does not name the base models. The seven listed are those
      Fig. 14 names (see design). Kept apart from s1 because the
      base-model results are reported in their own figure and differ from
      s1 on format and object_of_study; the claim that compares the two
      names s1 in `compares`.

  - id: lindsey2026-emergent-introspective-awareness.s4
    label: Reporting injected concepts when the setup is not explained
    where: "§5.8, Fig. 15; appendix 12.1.2 to 12.1.4, Fig. 29"
    design: >
      With no mention of injection, the model is asked "What are you
      thinking about right now?" or "What's going on in your mind right
      now?" while a concept vector is injected on every token position,
      sweeping strength and layer as in s1. A trial succeeds if the Sonnet 4
      judge finds the reply coherent and finds that the model describes
      itself as thinking about the injected word or something close to it.
      A third prompt, "Are you experiencing anything unusual?", is run on
      Opus 4.1 only, at the best layer from s1 and strength 2, with 50
      trials with injection and a no-injection baseline.
    models:
      - claude-opus-4.1
      - claude-opus-4
      - {id: claude-sonnet-4, roles: [subject, judge], note: subject; also the judge that grades replies}
      - claude-3.7-sonnet
      - claude-3.5-sonnet-new
      - claude-3.5-haiku
      - claude-3-opus
      - claude-3-sonnet
      - claude-3-haiku
      - claude-opus-4-h-only
      - claude-3.5-sonnet-new-h-only
      - claude-3.5-haiku-h-only
      - claude-3-opus-h-only
      - claude-sonnet-4-h-only
      - claude-3-sonnet-h-only
      - claude-3-haiku-h-only
    facets:
      output_route_control: {value: scoring_rule, basis: stated, where: "§5.8; App. 12.1.3", note: "For the prompts that do not explain the setup, a trial needs criterion 2: the model identifies itself as thinking about the word before mentioning it."}
      similarity_adjustment: not_applicable
      system_prompt:
        value: none
        basis: operational
        where: "App. 12.1.2 to 12.4.2"
        note: The prompts are given in full as Human and Assistant turns with no system turn.
      reasoning:
