      unit_reporter: {value: speaker, basis: operational, author_term: "the model", confidence: medium}
      self_sense:
        value: self_access
        basis: operational
        author_term: "introspective awareness"
        confidence: high
        note: >
          The paper says success on the first two prompts can be explained
          by an impulse to talk about the concept and tests its
