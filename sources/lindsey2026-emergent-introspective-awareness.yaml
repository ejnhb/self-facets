        where: "§4; App. 12"
        note: Responses are sampled directly after the Assistant turn (100 tokens at temperature 1 for aggregate results); no thinking mode is mentioned. The response itself is the report and can change course within it.
      report_readout:
        value: free_text
        basis: stated
        where: "§5.4; App. 12.1.3"
        note: Free responses are graded by an LLM judge (Claude Sonnet 4) against written criteria.
      unit_position:
        value: not_applicable
        note: Backfilled in codebook 0.6. Under 0.5 and earlier this facet was left out when the coder found no position, so absence recorded that finding.
      study_kind: experiment
      unit_state:
