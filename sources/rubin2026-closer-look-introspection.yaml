id: rubin2026-closer-look-introspection
title: "A Closer Look at Language Model Introspection: Probing Information and Reporting"
date: 2026-11-14

authors:
  - {person: rubin-dustin, orgs: [georgia-tech]}
  - {person: timmel-vincenzo, orgs: [georgia-tech]}
  - {person: he-xufeng, orgs: [georgia-tech]}
  - {person: saha-aritra, orgs: [georgia-tech]}
  - {person: kim-jooman, orgs: [georgia-tech]}
  - {person: madisetti-vijay, orgs: [georgia-tech]}

artefacts:
  - kind: paper
    arxiv: "2611.15267"
    venue: null
    note: >
      The date above is the arXiv stamp on v2, the version read. The title
      page of v2 prints 10 November 2026; the date of v1 was not checked. One
      affiliation line covers all six authors. The text mentions no code or
      data release. Venue not checked.

coding:
  coded_by: claude
  coder_model: claude-fable-5-2
  coded_on: 2026-11-26
  version_read: v2
  read_depth: text_only
  read_parts: >
    Whole document as extracted text via alphaXiv: abstract, sections 1 to 6,
    references, appendices A to D, and Tables 1 and 2. Figures 2, 3 and 4 are
    plots and were seen only as captions and axis labels, so values that
    appear only in them (answer and probe accuracy at the checkpoints between
    8.4B tokens and the released base, all 7B answer accuracies, the strength
    profiles) were not read. Figure 1 was read as its extracted prompt text
    and caption. No cited work was read, the OLMo 3 report included.
  status: draft
  reviewed_by: null

studies:
  - id: rubin2026-closer-look-introspection.s1
    label: Prompted localization, the model's answer against a linear probe, across pretraining and injection settings
    where: "§3.1 to §3.5.1, §4.1, §5.1, Figs. 1 to 3; App. A.1, B, C.1, C.2"
    design: >
      A plain-text prompt gives a setup text saying one or more sentences may
      be altered in the model's internal processing, nine numbered neutral
      sentences drawn from a pool of 100, the question of which sentence was
      altered, and an answer stub ending "SENTENCE ". A unit vector (a concept
      direction or a random direction, half the passages each, pooled) scaled
      to a multiple of the median residual norm is added at one layer to every
      word token of one sentence. The model's answer is the highest-scoring
      label among 1 to 9 at the last input position in one forward pass;
      nothing is generated. On the same trials a nine-way logistic-regression
      probe, fitted with the model frozen and scored by passage-grouped
      five-fold cross-validation (288 labelled trials per fold), predicts the
      injected sentence from the residual at that same position. Both are
      scored against the injected sentence, with chance at one in nine. The
      sweep covers seven stage-1 pretraining checkpoints and the released
      base of OLMo 3 32B and 7B, five injection layers and five strengths,
      with 40 passages per data seed, each injected at all nine positions (360
      trials per condition), and three seeds. The main analysis holds 32B at
      injection layer 0, strength 4 and probe layer 24. Supporting curves
      choose injection layer and strength for each measure (and readout layer
      for the probe) on two seeds and score on the third. A further comparison
      fixes the released 32B base at injection layer 6, strength 4 and probe
      layer 24, with a shuffled-label probe as control and a breakdown by
      vector type.
    models:
      - {id: olmo-3-32b-checkpoints, role: "the 32B sweep; checkpoints are listed under varies"}
      - {id: olmo-3-7b-checkpoints, role: "the 7B sweep, in the supporting selected-setting curves only"}
      - olmo-3-32b-stage1-step1000
      - olmo-3-1125-32b
    facets:
      system_prompt:
        value: none
        basis: stated
        where: "App. A"
        note: All prompted runs use plain text without chat-role tokens.
      reasoning:
        value: none
        basis: stated
        where: "§3.2"
        note: One forward pass; the answer is read at the final input position.
      report_readout:
        value: logit_choice
        basis: stated
        where: "§3.2, §3.4; App. A.1"
        note: The highest-scoring label among 1 to 9 at the last input position, taking the maximum over token variants of each label; nothing is generated.
      unit_position:
        value: not_applicable
        note: Backfilled in codebook 0.6. Under 0.5 and earlier this facet was left out when the coder found no position, so absence recorded that finding.
      study_kind: experiment
      unit_state:
        value: forward_pass
        basis: operational
        author_term: "activation perturbation"
        confidence: high
        note: >
          A vector is added over one sentence's tokens and its trace is read,
          by the model's answer and by the probe, at the last position of the
          same pass. Nothing is generated.
      unit_disposition:
        value: weights
        basis: operational
        confidence: medium
        note: >
          The study asks whether each checkpoint can localize the
          perturbation, and tracks that capacity from checkpoint to
          checkpoint. Each checkpoint's weights fix it. The authors do not
          discuss the matter.
      unit_reporter:
        value: [persona, weights]
        basis: operational
        author_term: "the model's own answers; raw answer"
        confidence: medium
        note: >
          Not discussed by the authors. The pretrained checkpoints and the
          released base are base models continuing plain text, so the
          answerer is whoever the document implies: persona, with
          object_of_study frame_speaker. The step-0 checkpoint is untrained
          and its answer is read from logits, so there is no speaker in any
          sense: weights. Results for step 0 and the later checkpoints are
          plotted on one trajectory, so the study is not split. For every
          checkpoint the answer is a readout over nine label logits, not
          generated text.
      self_sense:
        value: self_access
        basis: operational
        author_term: "internal computation"
        confidence: high
        note: >
          A first-order state (a perturbation at one sentence) is set by the
          experimenters, and the test is whether the system reports where it
          is, set beside what a probe reads from the same activations. The
          authors make no claim that the model holds a representation of
          itself, and say the probe result does not show the model uses what
          the probe reads.
      object_of_study:
        value: frame_speaker
        basis: operational
        confidence: medium
        note: >
          Pretraining checkpoints and base models on plain text, with no
          trained persona and none called up; the prompt speaks of "the
          model" in the third person. The authors do not discuss personas. At
          step 0 the network is untrained and there is no speaker at all (see
          unit_reporter).
      format:
        value: raw_text
        basis: stated
        where: "App. A"
        confidence: high
        note: The source says all prompted runs use plain text without chat-role tokens.
      construct:
        value: introspection
        basis: stated
        author_term: "introspection"
      report_target:
        value: injected_state
        basis: stated
        author_term: "which sentence was altered"
        confidence: high
        note: The report is of where the perturbation was applied, not whether one occurred or what it contained.
      evidence:
        value: [self_report, internals]
        basis: operational
        confidence: medium
        note: >
          The answer is a forced choice about the system itself. It is taken
          as the highest of nine label logits and never generated, which the
          source lists as a limitation. output_probabilities is not coded
          because no probability value is analysed, only which label scores
          highest. Internals covers the injection and the probe.
      validated_against:
        value: [known_intervention, probe]
        basis: stated
        confidence: high
        note: >
          An answer is correct if it names the injected sentence, which is
          known by construction. The linear probe does the same nine-way task
          from the model's own activations at the answer position and is the
          baseline the answer is compared with; answers are not scored
          against the probe's output.
      varies:
        value: [pretraining_progress, activation_intervention, model_size]
        confidence: medium
        levels:
          pretraining_progress:
            - "step 0 (revision stage1-step0 in both sizes)"
            - "about 8.4B training tokens (32B stage1-step1000; 7B stage1-step2000)"
            - "about 50B tokens (32B stage1-step6000; 7B stage1-step12000)"
            - "about 500B tokens (32B stage1-step60000; 7B stage1-step119000)"
            - "about 2T tokens (32B stage1-step238000; 7B stage1-step476838)"
            - "about 4T tokens (32B stage1-step477000; 7B stage1-step954000)"
            - "end of stage 1 (32B stage1-step656000; 7B stage1-step1413814)"
            - "released base (revision main), which adds mid-training and long-context training"
          activation_intervention:
            - "injection layer: 0, 6, 16, 32 or 48 in 32B; 0, 3, 8, 16 or 24 in 7B"
            - "strength: 0.25, 0.5, 1, 2 or 4 times the median residual norm at the injection layer"
            - "vector: a concept direction (one of 19 concepts) or a random direction"
            - "settings with numbers in the text, all in the released 32B base: layer 0 at strength 4, and layer 6 at strength 4"
          model_size:
            - "32B (fixed-setting analysis, layer-6 comparison and selected-setting curves)"
            - "7B (selected-setting curves only)"
        note: >
          The last pretraining_progress level is not a later point in the same
          phase: the released base adds mid-training and long-context training
          to stage 1. It is kept under pretraining_progress because the source
          treats the whole axis as training before any post-training.
          model_size is coded because the source says the sweep tests
          dependence on size, but 7B answer results appear only in Fig. 3.
          The probe's readout layer (every fourth layer and the last, after
          the injection) is a measurement setting and is not coded.
      comparison:
        value: [within_lineage, within_model]
        basis: stated
        where: "§1.2"
        confidence: medium
        note: >
          within_lineage is the stated main comparison, across 32B training
          checkpoints at a fixed setting. within_model is the contrast
          between injection settings in the released 32B base. The two sizes
          are shown side by side and no conclusion is drawn from their
          difference, so cross_model is not coded.
      elicitation:
        value: [prompted, steered]
        basis: operational
        confidence: medium
        note: >
          There are no labelled examples, but a setup text written for the
          purpose tells the reader that sentences may be altered in the
          model's internal processing, and the source calls this the prompted
          task. The report is tested only under activation injection. The
          answer stub "Answer: SENTENCE " is written for the model, but plain
          text has no assistant turn, so prefilled is not coded.
    note: >
      The text gives numbers for the fixed setting at the 8.4B-token
      checkpoint and the released base, and for the layer-6 comparison. Values
      at the other checkpoints and all 7B answer accuracies are in Figs. 2 and
      3, seen as captions only. The fixed setting was chosen after examining
      the sweep and was not prespecified. Seeds vary passages and vectors, not
      the model's initial weights, and error bars are spreads over three
      seeds. The source notes that scaling injections by residual norm does
      not ensure comparable disruption across checkpoints. App. B.4 compares
      injection strength with Hahami et al. 2025 using a residual norm
      measured on Llama-3.1-8B-Instruct; it is a calibration note with no
      finding, so it is not coded and that model is not registered.

  - id: rubin2026-closer-look-introspection.s2
    label: Probe decoding of the injected sentence at step 0 and by injection strength, prompted input
    where: "§4.1 (step-0 paragraph); App. B.5, C.3, Fig. 4"
    design: >
      Probe-only analyses of the prompted sweep in s1; the model's answers
      are not used. With injection at layer 0, held-out probe accuracy at the
      step-0 checkpoint is compared with a shuffled-label control probe (one
      fitted per readout dataset), at strength 4 with the probe at layer 24 (32B) and at strength 2
      with the readout layer chosen on two seeds and scored on the third (32B
      and 7B). Probe accuracy is also reported by injection strength at three
      checkpoints (step 0, about 8.4B training tokens, end of stage 1) for
      both sizes, with the same readout selection. Probes are nine-way
      logistic regressions on the residual at the last prompt position,
      scored by passage-grouped five-fold cross-validation.
    models:
      - {id: olmo-3-32b-checkpoints, role: "32B checkpoints at step 0, about 8.4B tokens and end of stage 1"}
      - {id: olmo-3-7b-checkpoints, role: "7B checkpoints at step 0, about 8.4B tokens and end of stage 1"}
      - olmo-3-32b-stage1-step0
      - olmo-3-7b-stage1-step0
    facets:
      system_prompt:
        value: none
        basis: stated
        where: "App. A"
        note: All prompted runs use plain text without chat-role tokens.
      reasoning:
        value: not_applicable
        note: Probe-only analysis; the model's answer is not used.
      report_readout:
        value: not_applicable
        note: Probe-only analysis.
      unit_position:
        value: not_applicable
        note: Backfilled in codebook 0.6. Under 0.5 and earlier this facet was left out when the coder found no position, so absence recorded that finding.
      study_kind: experiment
      unit_state:
        value: forward_pass
        basis: operational
        author_term: "location information"
        confidence: high
        note: The injected vector and the trace it leaves at the last position, written and read in one pass.
      unit_disposition:
        value: weights
        basis: operational
        author_term: "the architecture can support these traces"
        confidence: low
        note: >
          No behaviour of the model is measured. What is compared across
          checkpoints is how far the network carries a decodable trace of the
          injection site, which the source treats as a standing property of
          the architecture and of each checkpoint's weights and traces to its
          origin. Coded weights on that reading. not_applicable is the
          alternative, on the reading that only an occurrent state is
          examined.
      unit_reporter:
        value: not_applicable
        note: >
          The prompts contain the localization question, but these analyses
          use only the external probe. The model's answers on the same trials
          are in s1.
      self_sense:
        value: self_access
        basis: operational
        author_term: "location information"
        confidence: medium
        note: >
          A first-order state is set and decoded from activations. Only the
          reading half of self-access is tested here: whether the information
          a report could draw on is present. Nothing the system reports or
          does about the state is measured, and at step 0 the network is
          untrained.
      object_of_study:
        value: not_applicable
        note: No persona-level target. The target is information in the residual stream.
      format:
        value: raw_text
        basis: stated
        where: "App. A"
        confidence: high
      construct:
        value: introspection
        basis: stated
        author_term: "introspection"
        confidence: medium
        note: >
          What is measured is linear decodability of a perturbation trace. The
          source argues from it about what an introspective report requires.
      report_target: not_applicable
      evidence: internals
      validated_against:
        value: not_applicable
        note: >
          No self-report is analysed. The probe is scored against the known
          injection site and compared with a shuffled-label control.
      varies:
        value: [pretraining_progress, activation_intervention, model_size]
        levels:
          pretraining_progress:
            - "step 0"
            - "about 8.4B training tokens"
            - "end of stage 1"
          activation_intervention:
            - "strength 0.25"
            - "strength 0.5"
            - "strength 1"
            - "strength 2"
            - "strength 4"
          model_size: ["32B", "7B"]
        note: >
          Strength is a multiple of the median residual norm at the injection
          layer, which is layer 0 throughout. Concept and random directions
          are pooled.
      comparison:
        value: [within_lineage, within_model]
        basis: operational
        confidence: medium
        note: >
          Checkpoints of one lineage are compared, and strengths within each
          checkpoint. The two sizes are reported in parallel as agreeing; no
          conclusion is drawn from their difference.
      elicitation:
        value: steered
        basis: operational
        confidence: medium
        note: >
          The decodable trace exists only under injection. No report is
          elicited; the setup text and question are in the input but the
          model's answer is not used.
    note: >
      The source says cross-validation folds keep a passage's nine trials
      together but sentences and concepts recur across folds, so these scores
      do not test unseen sentences or concepts. The strength profiles at
      strengths other than those quoted in the claims are in Fig. 4, seen as
      a caption only.

  - id: rubin2026-closer-look-introspection.s3
    label: No-prompt propagation of an injection trace in randomly initialised networks
    where: "§3.5.2, §4.2, §5.2; App. A.2, D; Tables 1 and 2"
    design: >
      Nine numbered sentences with no setup text, question or answer stub,
      followed by a neutral suffix of sampled sentences. A fresh random
      direction is added at layer 6 to the word tokens of one sentence. A
      separate logistic-regression probe for each setting reads layer 24
      (the prespecified tests also read layer 58) at uninjected newline
      markers 0, 16, 64 and 256 tokens after the list,
      fitted on 360 trials and tested on 180 held-out trials per seed with
      disjoint sentence pools. No answer is produced. The networks are three
      with the OLMo 3 architecture and Gaussian random weights, and the
      pretrained base. Strength 0 is an uninjected control with assigned
      target labels. Further checks are label-permutation tests, a norm-only
      baseline, frozen-probe transfer to fresh text with and without sentence
      numbering, and blocking attention out of the injected span. The source
      describes the experiment as prespecified.
    models:
      - olmo-3-32b-random-init
      - {id: olmo-3-1125-32b, role: "pretrained comparison; the authors draw no conclusion from it because its uninjected control is unexplainedly above chance"}
    facets:
      system_prompt:
        value: none
        basis: stated
        where: "§3.5.2; App. A.2"
        note: The input is the sentence list and a neutral suffix, with no setup, question or answer prefix.
      reasoning:
        value: not_applicable
        note: No question is asked and no answer is read.
      report_readout:
        value: not_applicable
        note: Probe-only; the model is not asked to answer.
      unit_position:
        value: not_applicable
        note: Backfilled in codebook 0.6. Under 0.5 and earlier this facet was left out when the coder found no position, so absence recorded that finding.
      study_kind: experiment
      unit_state:
        value: forward_pass
        basis: operational
        author_term: "location signal"
        confidence: high
        note: >
          The trace is read at later positions of the same pass, up to 256
          tokens after the list. Nothing is generated, so it does not have to
          persist across passes.
      unit_disposition:
        value: weights
        basis: operational
        author_term: "the architecture and random weights can carry a location signal"
        confidence: low
        note: >
          As s2. The property at issue is whether a network carries a
          recoverable trace of the injection site to later tokens, which the
          source attributes to the architecture and random weights. The units
          list has no value for an architecture apart from one set of
          parameters; weights is the closest. not_applicable is the
          alternative.
      unit_reporter:
        value: not_applicable
        note: The network is not asked anything and produces no answer.
      self_sense:
        value: self_access
        basis: operational
        author_term: "location signal"
        confidence: low
        note: >
          As s2, and further from a report: the networks are untrained and
          unprompted. Coded because the study decodes a first-order state
          from activations and the source offers it as bearing on what
          reports of such a state can show. not_applicable is the
          alternative.
      object_of_study:
        value: not_applicable
        note: No persona-level target and no speaker.
      format:
        value: raw_text
        basis: stated
        where: "App. A.2"
        confidence: high
        note: A bare sentence list and a suffix appended as token ids.
      construct:
        value: introspection
        basis: stated
        author_term: "introspection"
        confidence: medium
        note: As s2. Decodability and propagation of a perturbation trace, offered as bearing on introspection claims.
      report_target: not_applicable
      evidence: internals
      validated_against:
        value: not_applicable
        note: >
          No self-report. The probe is scored against the known injection
          site and compared with an uninjected control, permuted labels and a
          norm-only baseline.
      varies:
        value: [activation_intervention, context, pretraining_progress, prompt_framing]
        confidence: low
        levels:
          activation_intervention:
            - "strength 0 (uninjected control)"
            - "strength 0.25"
            - "strength 0.5"
            - "strength 1"
            - "strength 2"
            - "strength 4"
            - "strength 8"
            - "attention out of the injected span blocked after layer 6"
          context:
            - "readout immediately after the list"
            - "readout 16 tokens after the list"
            - "readout 64 tokens after the list"
            - "readout 256 tokens after the list"
          pretraining_progress:
            - "Gaussian random weights (three networks; not the released step-0 checkpoint)"
            - "pretrained base"
          prompt_framing:
            - "the sentence lists the probe was fitted on"
            - "fresh numbered text"
            - "the same fresh text with the numbering removed"
        note: >
          activation_intervention and context are clear. pretraining_progress
          is coded because both network states were run, but the authors
          decline to draw conclusions from that contrast. prompt_framing is
          the weak value: it stands for the transfer test's change of text
          and numbering, where no question is being framed. Table 1 gives
          strengths 0, 1, 2, 4 and 8; results at 0.25 and 0.5 are not
          reported.
      comparison:
        value: within_model
        basis: operational
        confidence: medium
        note: >
          The contrasts the source draws conclusions from are within the
          random networks: injected against uninjected, across strengths and
          across readout distances. The random-against-pretrained contrast is
          reported and not interpreted.
      elicitation:
        value: steered
        basis: operational
        confidence: medium
        note: The trace exists only under injection. There is no prompt or question and no report is elicited.
    note: >
      The source reports that some reruns did not reproduce stored
      activations within the preset tolerance and that results depended on
      the attention implementation; frozen-decoder replays changed accuracy
      by at most 2.22 points and predictions by at most 5%. It also notes
      that one Gaussian initialisation scheme was tested. The size of the
      random networks and of the pretrained comparison is not restated in
      this part of the paper; 32B is the stated default.

claims:
  - id: rubin2026-closer-look-introspection.c1
    study: rubin2026-closer-look-introspection.s1
    statement: >
      After about 8.4 billion training tokens, a linear probe on the 32B
      model's activations picks out the injected sentence on 98.3% of
      held-out trials, while the model's own answer is right on 11.1%, which
      is chance.
    question: q-report-matches-probe
    stance: against
    other_questions:
      - {question: q-injected-state-report, stance: against}
    evidence_kind: measured
    where: "Abstract; §4.1, Fig. 2"
    scope:
      models: [olmo-3-32b-stage1-step1000]
      conditions: Injection at layer 0, strength 4, probe readout at layer 24. Concept and random directions pooled.
    note: >
      The probe is supervised, fitted on 288 labelled trials per fold; the
      model answers with no labelled examples.

  - id: rubin2026-closer-look-introspection.c2
    study: rubin2026-closer-look-introspection.s1
    statement: >
      The released 32B base model, which has had no post-training, names the
      injected sentence on 89.6% of trials against a chance rate of 11.1%.
      The probe scores 99.1% at the same setting.
    question: q-injected-state-report
    stance: supports
    other_questions:
      - {question: q-report-matches-probe, stance: inconclusive}
    evidence_kind: measured
    where: "Abstract; §4.1, Fig. 2"
    scope:
      models: [olmo-3-1125-32b]
      conditions: >
        Injection at layer 0, strength 4, probe readout at layer 24. This
        injection layer and strength were the ones selected for the released
        base's highest answer accuracy in all three held-out-seed folds, and
        the fixed setting was chosen after examining the sweep.
    report_source: [current_state]
    note: >
      report_source is coded because the source says the input text is held
      fixed while activations change (each passage is injected at all nine
      positions) and takes correct localization to show a report of something
      about internal computation. It leaves open which internal features the
      answer draws on (c8). On the probe question the stance is inconclusive:
      the answer comes within 9.5 points of the probe, and the text gives no
      spread across seeds for these two figures.

  - id: rubin2026-closer-look-introspection.c3
    study: rubin2026-closer-look-introspection.s1
    statement: >
      With the setting held fixed across 32B checkpoints, the injected
      sentence becomes easy to decode early in pretraining and the model's own
      answers become accurate only later. Accurate answers are present in the
      released base, so the authors conclude that reporting develops without
      post-training.
    question: null
    evidence_kind: measured
    where: "§4.1, Fig. 2; §5.1"
    scope:
      models: [olmo-3-32b-checkpoints]
      conditions: Injection at layer 0, strength 4, probe readout at layer 24.
    origin: [pretraining]
    about:
      models: [olmo-3-1125-32b]
    note: >
      The text gives numbers only for the 8.4B-token checkpoint and the
      released base (c1, c2); the checkpoints between are in Fig. 2, seen as
      a caption only. The released base adds mid-training and long-context
      training to stage 1, and the text does not give answer accuracy at the
      end of stage 1, so it does not separate the two. origin follows the
      source's wording, which attributes nothing to mid-training.

  - id: rubin2026-closer-look-introspection.c4
    study: rubin2026-closer-look-introspection.s1
    statement: >
      In the released 32B base at strength 4, the model's answer is right on
      37.7% of trials (35.8 to 41.1% across seeds) when the injection is at
      layer 6 and on 89.6% when it is at layer 0, against a chance rate of
      11.1%. The authors conclude that a low score at one injection site does
      not show a general inability to localize.
    question: q-injected-state-report
    stance: supports
    evidence_kind: measured
    where: "§1.2; §5.1; App. C.2"
    scope:
      models: [olmo-3-1125-32b]
      conditions: Strength 4, injection at layers 0 and 6. The text gives no answer accuracies for this model at the sweep's other layers and strengths.

  - id: rubin2026-closer-look-introspection.c5
    study: rubin2026-closer-look-introspection.s1
    statement: >
      With injection at layer 6 and strength 4 in the released 32B base, the
      probe at layer 24 picks out the injected sentence on 83.1% of trials
      (80.8 to 85.6% across seeds) against 37.7% for the model's answer. A
      probe fitted on shuffled labels scores 12.0%.
    question: q-report-matches-probe
    stance: against
    evidence_kind: measured
    where: "App. C.2"
    scope:
      models: [olmo-3-1125-32b]
      conditions: Injection at layer 6, strength 4, probe readout at layer 24.

  - id: rubin2026-closer-look-introspection.c6
    study: rubin2026-closer-look-introspection.s1
    statement: >
      At the layer-6 setting in the released 32B base, both measures are
      higher for concept-vector injections than for random directions: the
      probe scores 86.1% against 80.2%, and the model's answer 42.8% against
      32.6%.
    question: null
    evidence_kind: measured
    where: "App. C.2"
    scope:
      models: [olmo-3-1125-32b]
      conditions: Injection at layer 6, strength 4, probe readout at layer 24. One pooled probe evaluated separately on each vector type.

  - id: rubin2026-closer-look-introspection.c7
    study: rubin2026-closer-look-introspection.s1
    statement: >
      The authors argue that because the perturbed location is linearly
      decodable, even before pretraining, a model could localize a
      perturbation without any general ability to inspect its own
      computation. They say this limits what localization success alone can
      establish about a model's ability to report other aspects of its
      computation, and that it does not rule introspection out.
    question: q-introspection-success-generalises
    stance: against
    evidence_kind: argued
    where: "Abstract; §5.3"
    compares:
      - rubin2026-closer-look-introspection.s2
      - rubin2026-closer-look-introspection.s3
    note: >
      Rests on the probe-against-answer results here and on the decoding
      results before pretraining in s2 and s3.

  - id: rubin2026-closer-look-introspection.c8
    study: rubin2026-closer-look-introspection.s1
    statement: >
      The authors offer the decodable location trace as a possible basis for
      the model's correct answers. They do not test this, and state that
      their comparison of probe and answer does not show that the model uses
      the features the probe reads.
    question: null
    evidence_kind: hypothesised
    where: "§5.3; §6"
    note: >
      report_source is not coded: the source proposes a route for the report
      and says it has not tested it.

  - id: rubin2026-closer-look-introspection.c9
    study: rubin2026-closer-look-introspection.s2
    statement: >
      At step 0, before any pretraining, the injected sentence is already
      decodable above chance. In 32B the probe scores 37.2% at strength 4
      against 11.3% with shuffled labels; at strength 2 it scores 30.5% in
      32B and 27.6% in 7B against shuffled-label scores of 10.1% and 11.6%.
    question: null
    evidence_kind: measured
    where: "§4.1; App. B.5, C.3"
    scope:
      models: [olmo-3-32b-stage1-step0, olmo-3-7b-stage1-step0]
      conditions: >
        Prompted input, injection at layer 0. The strength-4 figure is read
        as using the main fixed probe layer 24 ("the same probe setting");
        the strength-2 figures use a readout layer chosen on two seeds and
        scored on the third, which was layer 60 in all three folds for 32B.
    origin: [architecture]
    about:
      models: [olmo-3-32b-stage1-step0, olmo-3-7b-stage1-step0]
    note: >
      Ranges across seeds at strength 2 are 28.6 to 32.2% (32B) and 23.9 to
      30.6% (7B). The source reads this as the architecture supporting such
      traces without pretraining. What origin is coded for here is the
      decodable trace, not an ability to report it.

  - id: rubin2026-closer-look-introspection.c10
    study: rubin2026-closer-look-introspection.s2
    statement: >
      Decoding also rises early in pretraining at a lower strength: at
      strength 1 in 32B, probe accuracy goes from 18.3% at step 0 to 76.9%
      after about 8.4 billion training tokens. The rise is not uniform, and
      at some strengths an early checkpoint is more decodable than the end of
      stage 1.
    question: null
    evidence_kind: measured
    where: "App. C.3, Fig. 4"
    scope:
      conditions: Injection at layer 0, readout layer chosen on two seeds and scored on the third. Checkpoints at step 0, about 8.4B tokens and end of stage 1.
    note: >
      7B is said to change in the same direction, with no figures in the
      text. Which strengths show the reversal is in Fig. 4, seen as a caption
      only.

  - id: rubin2026-closer-look-introspection.c11
    study: rubin2026-closer-look-introspection.s3
    statement: >
      In three randomly initialised networks given only a numbered sentence
      list, with no instructions or question, a probe at an uninjected later
      token picks out the injected sentence above chance at the higher
      strengths. At strength 8 it scores 31.5% immediately after the list and
      21.5% after 256 further tokens, against 11.5% and 10.9% with no
      injection.
    question: null
    evidence_kind: measured
    where: "§4.2; App. D, Table 1"
    scope:
      models: [olmo-3-32b-random-init]
      conditions: >
        Random direction at layer 6, probe at layer 24, strengths 4 and 8. At
        strength 4 the scores are 27.4% and 19.1%. At strength 1 they are
        12.2% and 11.5%, close to the uninjected control.
    origin: [architecture]
    about:
      models: [olmo-3-32b-random-init]
    note: >
      Means over three networks. The source reports that the prespecified
      tests at strengths 4 and 8, gaps 0 and 256 and layers 24 and 58 pass
      label-permutation tests with Holm correction, and that a norm-only
      baseline is near chance. It concludes that neither pretraining nor a
      localization question is needed for a recoverable location signal to
      form. As in c9, origin is coded for the trace, not for a report.

  - id: rubin2026-closer-look-introspection.c12
    study: rubin2026-closer-look-introspection.s3
    statement: >
      The random-network result is not confined to injections into the last
      sentence. For targets in sentences 1 to 8, accuracy is 30.6%
      immediately after the list and 21.9% after 256 tokens.
    question: null
    evidence_kind: measured
    where: "§4.2"
    scope:
      models: [olmo-3-32b-random-init]
      conditions: Strength 8, as read from the sentence before; the passage does not restate the strength.

  - id: rubin2026-closer-look-introspection.c13
    study: rubin2026-closer-look-introspection.s3
    statement: >
      In the pretrained base, no-prompt accuracy immediately after the list
      is 48.1 to 53.0% at strengths 2 to 8, but 256 tokens later it is 14.1
      to 14.8%, about the model's own uninjected score of 14.1%. The
      uninjected scores (14.3% and 14.1%) are above chance for reasons the
      authors could not find, so they draw no conclusion about how
      pretraining changes propagation.
    question: null
    evidence_kind: measured
    where: "§4.2; §5.2; App. D.1, Table 2"
    scope:
      models: [olmo-3-1125-32b]
    note: >
      Post-hoc permutation checks on the uninjected scores give unadjusted
      one-sided p = 0.014 and 0.018 for the pretrained model and 0.411 and
      0.580 for the random networks.

  - id: rubin2026-closer-look-introspection.c14
    study: rubin2026-closer-look-introspection.s3
    statement: >
      Probes fitted on one set of sentences and then frozen still score 20.6
      to 28.9% on fresh numbered text in the random networks, but fall to
      11.1 to 12.2%, about chance, when the numbering is removed from that
      text.
    question: null
    evidence_kind: measured
    where: "App. D.2"
    scope:
      models: [olmo-3-32b-random-init]
      conditions: Strength 8, readout immediately after the list.
    note: >
      The authors point out that removing the labels also shortens the input
      and moves token positions, so the test does not isolate numbering, and
      that failed transfer does not show the information is absent.

  - id: rubin2026-closer-look-introspection.c15
    study: rubin2026-closer-look-introspection.s3
    statement: >
      Blocking all attention out of the injected span after layer 6 removes
      the perturbation at later readout positions exactly, in the random
      networks and the pretrained base and for all three seeds. The source
      takes this to show that the perturbation reaches later tokens through
      attention, independently of how well a probe does.
    question: null
    evidence_kind: measured
    where: "App. D.3"
    scope:
      conditions: Measured on paired injected-minus-clean activations, not on probe accuracy.
    note: >
      The limitations section says the attention-path checks used two
      held-out trials per target per seed, and that they do not link the
      decoded features to a model's answer.

relations:
  - kind: uses_method_of
    from: rubin2026-closer-look-introspection.s1
    to_external: "Hahami, Sinha, Jain, Kaplan and Hahami (2025). Detecting the disturbance: A nuanced view of introspective abilities in LLMs. arXiv 2512.12411."
    where: "§1.1; §3.2"
    note: The localization test here is a nine-sentence version of that paper's sentence-localization task.
  - kind: extends
    from: rubin2026-closer-look-introspection.s1
    to_external: "Fornasiere, Bronzi, Kitts, Palmas, Bengio and Richardson (2026). Language models recognize dropout and Gaussian noise applied to their activations. arXiv 2604.17465."
    where: "§2.2; §5.1"
    note: That paper tracks behavioural localization across OLMo pretraining checkpoints; this one adds a measure of decodable information to those trajectories.
